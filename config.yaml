# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
name: Velodrome_v2
description: Multi-chain indexer for Velodrome V2, Aerodrome and Aero (MetaDEX) pools
rollback_on_reorg: true
raw_events: false
# Docs: https://docs.envio.dev/docs/HyperIndex/configuration-file#storage
storage:
  postgres:
    default: true
  clickhouse:
    default: true
field_selection:
  transaction_fields:
    - "hash"
    - "from"
contracts:
  - name: FactoryRegistry
    abi_file_path: abis/FactoryRegistry.json
    handler: src/EventHandlers/FactoryRegistry.ts
    events:
      - event: Approve
      - event: Unapprove
  - name: PoolFactory
    abi_file_path: abis/PoolFactory.json
    handler: src/EventHandlers/PoolFactory.ts
    events:
      - event: PoolCreated
      - event: SetCustomFee
      # Superchain leaf PoolFactory only (not in the Optimism/Base ABI): the
      # stable / volatile default fee, emitted at deployment.
      - event: "SetDefaultFee(bool indexed stable, uint256 fee)"
        name: SetDefaultFee
  - name: RootCLPoolFactory
    abi_file_path: abis/RootCLPoolFactory.json
    handler: src/EventHandlers/RootCLPoolFactory.ts
    events:
      - event: RootPoolCreated
  - name: CLFactory
    abi_file_path: abis/CLFactory.json
    handler: src/EventHandlers/CLFactory.ts
    events:
      - event: PoolCreated
      - event: TickSpacingEnabled
  - name: CLPool
    abi_file_path: abis/CLPool.json
    handler: src/EventHandlers/CLPool.ts
    events:
      - event: Burn
      - event: Collect
      - event: CollectFees
      - event: Flash
      - event: IncreaseObservationCardinalityNext
      - event: Initialize
      - event: Mint
      - event: SetFeeProtocol
      - event: Swap
  - name: NFPM
    abi_file_path: abis/NFPM.json
    handler: src/EventHandlers/NFPM/NFPM.ts
    events:
      - event: Transfer
      - event: IncreaseLiquidity
      - event: DecreaseLiquidity
      # Carries the tokenId CLPool.Collect lacks: credits the fees CLPool.Collect
      # isolated to the position owner instead of the NFPM contract.
      - event: Collect
  - name: VeNFT
    abi_file_path: abis/VeNFT.json
    handler: src/EventHandlers/VeNFT/VeNFT.ts
    events:
      - event: Deposit
      - event: DepositManaged
      - event: LockPermanent
      - event: Merge
      - event: Split
      - event: UnlockPermanent
      - event: WithdrawManaged
      - event: Withdraw
      - event: Transfer
  - name: Pool
    abi_file_path: abis/Pool.json
    handler: src/EventHandlers/Pool.ts
    events:
      - event: Mint
      # Superchain-leaf V2 pools emit a 4-arg Mint with the LP recipient (#886).
      # Canonical OP/Base pools emit the 3-arg Mint above instead, so the two
      # are mutually exclusive per pool (distinct topic0) — no double count.
      - event: "Mint(address indexed sender, address indexed to, uint256 amount0, uint256 amount1)"
        name: MintWithRecipient
      - event: Burn
      - event: Fees
      - event: Claim
      # Aero V2 pools emit Claim with the account whose fees are claimed (the
      # legacy Claim has only sender and recipient). Distinct topic0.
      - event: "Claim(address indexed caller, address indexed account, address indexed recipient, uint256 amount0, uint256 amount1)"
        name: ClaimWithAccount
      - event: Swap
      - event: Sync
      - event: Transfer
  # --- Aero (MetaDEX) deployment, launched 2026-10-21 (ADR 0005) ---
  # Pools from these factories are registered into the shared Pool / CLPool
  # contracts and carry Pool.deployment = AERO. Event signatures are written
  # from the MIT/GPL interface files of the public metadex repos.
  - name: AeroCLFactory
    abi_file_path: abis/CLFactory.json
    handler: src/EventHandlers/CLFactory.ts
    events:
      - event: PoolCreated
      - event: TickSpacingEnabled
  - name: AeroStablePoolFactory
    handler: src/EventHandlers/AeroPoolFactory.ts
    events:
      - event: "PoolCreated(address indexed token0, address indexed token1, address pool, uint256 poolCount)"
      - event: "SetDefaultFee(uint256 defaultFee)"
  - name: AeroVolatilePoolFactory
    handler: src/EventHandlers/AeroPoolFactory.ts
    events:
      - event: "PoolCreated(address indexed token0, address indexed token1, address pool, uint256 poolCount)"
      - event: "SetDefaultFee(uint256 defaultFee)"
  - name: AeroNFPM
    handler: src/EventHandlers/NFPM/AeroNFPM.ts
    events:
      - event: "Transfer(address indexed from, address indexed to, uint256 indexed tokenId)"
      - event: "IncreaseLiquidity(uint256 indexed tokenId, uint128 liquidity, uint256 amount0, uint256 amount1, int24 tickLower, int24 tickUpper)"
      - event: "DecreaseLiquidity(uint256 indexed tokenId, uint128 liquidity, uint256 amount0, uint256 amount1)"
      - event: "Collect(uint256 indexed tokenId, address recipient, uint256 amount0, uint256 amount1)"
  - name: DynamicSwapFeeHook
    handler: src/EventHandlers/SwapFeeModule/DynamicSwapFeeHook.ts
    events:
      - event: "CustomFeeSet(address indexed pool, uint24 fee)"
      - event: "FeeCapSet(address indexed pool, uint256 feeCap)"
      - event: "ScalingFactorSet(address indexed pool, uint256 scalingFactor)"
      - event: "DynamicFeeReset(address indexed pool)"
  # V2 custom-fee modules: each leaf PoolFactory's feeModule() and the Aero
  # stable / volatile CustomFeeModules.
  - name: V2CustomFeeModule
    handler: src/EventHandlers/SwapFeeModule/V2CustomFeeModule.ts
    events:
      - event: "SetCustomFee(address indexed pool, uint256 indexed fee)"
  # Aero's curated token list (successor of the legacy whitelist): a listed
  # token is trusted for USD aggregates (Token.isListedOnAero).
  - name: AeroTokenRegistry
    handler: src/EventHandlers/AeroTokenRegistry.ts
    events:
      - event: "ListingSet(address indexed token, bool listed)"
  # --- Aero gauges, staking and emissions (phase 2, ADR 0006) ---
  # Signatures from the MIT interface files (IGaugeManager, IGaugeFactory,
  # ICLGaugeFactory, ILeafVoter, IV2Gauge, ICLGauge, IGauge,
  # IVotingRewardsManager, ICustomFeeModule), each checked against real logs.
  # Gauges and rewards managers are registered dynamically: the gauge
  # factories' GaugeCreated register AeroCLGauge / AeroV2Gauge, the
  # GaugeManager's GaugeCreated registers AeroVotingRewardsManager.
  - name: AeroGaugeManager
    handler: src/EventHandlers/Aero/AeroGaugeManager.ts
    events:
      - event: "GaugeCreated(address indexed target, address indexed gauge, address indexed module, address gaugeFactory, address votingRewardsManager, address creator, bool activated)"
  - name: AeroCLGaugeFactory
    handler: src/EventHandlers/Aero/AeroGaugeFactory.ts
    events:
      - event: "GaugeCreated(address indexed gauge, address indexed pool, bool isPool)"
      - event: "EmissionCapSet(address indexed gauge, uint128 cap, address indexed caller)"
      - event: "DefaultCapSet(uint128 cap)"
      - event: "OperatorCapRangeSet(uint128 minCap, uint128 maxCap)"
      - event: "MaxShareCapSet(uint256 cap)"
      - event: "ReferralConfigSet(address indexed gauge, address indexed referral, uint256 share)"
      - event: "PenaltyConfigSet(uint256 minStakeBlocks, uint256 penaltyRate)"
      - event: "MinStakeBlocksSet(address indexed gauge, uint256 minStakeBlocks)"
      - event: "EmergencyWithdrawEnabledSet(bool enabled)"
  - name: AeroV2GaugeFactory
    handler: src/EventHandlers/Aero/AeroGaugeFactory.ts
    events:
      - event: "GaugeCreated(address indexed gauge, address indexed pool, bool isPool)"
      - event: "EmissionCapSet(address indexed gauge, uint128 cap, address indexed caller)"
      - event: "DefaultCapSet(uint128 cap)"
      - event: "OperatorCapRangeSet(uint128 minCap, uint128 maxCap)"
      - event: "MaxShareCapSet(uint256 cap)"
      - event: "ReferralConfigSet(address indexed gauge, address indexed referral, uint256 share)"
      - event: "PenaltyConfigSet(uint256 minStakeBlocks, uint256 penaltyRate)"
      - event: "MinStakeBlocksSet(address indexed gauge, uint256 minStakeBlocks)"
      - event: "EmergencyWithdrawEnabledSet(bool enabled)"
  - name: AeroCLGauge
    handler: src/EventHandlers/Aero/AeroGauge.ts
    events:
      - event: "Deposit(address indexed caller, address indexed user, uint256 indexed tokenId, uint128 liquidityToStake)"
      - event: "Withdraw(address indexed caller, address indexed user, uint256 indexed tokenId, uint128 liquidityToStake)"
      - event: "EmergencyWithdraw(address indexed user, uint256 indexed tokenId, uint128 liquidityToStake)"
      - event: "EmissionsClaimed(address indexed account, uint256 indexed tokenId, address indexed recipient, uint256 rewardAmount)"
      - event: "EmissionsDeferred(address indexed account, uint256 indexed tokenId, uint256 rewardAmount)"
      - event: "ReferralEmissionsDeferred(address indexed account, uint256 indexed tokenId, address indexed referral, uint256 amount)"
      - event: "DeferredEmissionsClaimed(address indexed account, address indexed recipient, uint256 amount)"
      - event: "ReferralEmissionsClaimed(address indexed referral, address indexed recipient, uint256 amount)"
      - event: "EarlyWithdrawPenalty(address indexed from, uint256 indexed tokenId, uint256 penalty)"
      - event: "ClaimFees(address indexed caller, uint256 claimed0, uint256 claimed1)"
  - name: AeroV2Gauge
    handler: src/EventHandlers/Aero/AeroGauge.ts
    events:
      - event: "Deposit(address indexed caller, address indexed account, uint256 amount)"
      - event: "Withdraw(address indexed caller, address indexed account, uint256 amount)"
      - event: "EmergencyWithdraw(address indexed account, uint256 amount)"
      - event: "EmissionsClaimed(address indexed account, address indexed recipient, uint256 rewardAmount)"
      - event: "EmissionsDeferred(address indexed account, uint256 rewardAmount)"
      - event: "ReferralEmissionsDeferred(address indexed account, address indexed referral, uint256 amount)"
      - event: "DeferredEmissionsClaimed(address indexed account, address indexed recipient, uint256 amount)"
      - event: "ReferralEmissionsClaimed(address indexed referral, address indexed recipient, uint256 amount)"
      - event: "EarlyWithdrawPenalty(address indexed account, uint256 penalty)"
      - event: "ClaimFees(address indexed caller, uint256 claimed0, uint256 claimed1)"
  # Same address on every chain (Base included). Its claim-forwarding events
  # (FeeClaimSucceeded, IncentiveClaimSucceeded) are not indexed: the rewards
  # managers' own ClaimFees / ClaimIncentives carry the amounts.
  - name: AeroLeafVoter
    handler: src/EventHandlers/Aero/AeroLeafVoter.ts
    events:
      - event: "GaugeRegistered(address indexed gauge, bool activated, uint48 registrationCursor)"
      - event: "GaugeActivated(address indexed gauge, uint48 activationCursor)"
      - event: "GaugeCapSettled(address indexed gauge, uint128 effectiveShare, uint128 surplusDelta, uint128 cap, uint256 gaugeWeight)"
      - event: "EmissionsMinted(address indexed gauge, address[] recipients, uint128[] amounts)"
      - event: "EmissionsForfeited(address indexed gauge, uint128 amount)"
      - event: "Redeemed(address indexed redeemer, address indexed recipient, uint256 amount)"
      - event: "ChainStatusSet(uint8 status)"
      # Allocations (phase 3)
      - event: "ChainAllocated(uint256 indexed tokenId, uint128 allocationDelta, uint128 chainAllocation, uint256 emissionsPerVP)"
      - event: "GaugesAllocated(uint256 indexed tokenId, (address gauge, uint128 allocated, bytes data)[] allocations, uint256 emissionsPerVP)"
      - event: "Deallocated(uint256 indexed tokenId, uint128 amount)"
      - event: "EmergencyDeallocationApplied(uint256 indexed tokenId)"
      - event: "OperatorSet(uint256 indexed tokenId, address indexed operator)"
      - event: "CanVoteForZeroCapGaugesSet(uint256 indexed tokenId, bool allowed)"
      - event: "AllocationCooldownSet(uint48 allocationCooldown)"
      - event: "MaxGaugesSet(uint256 maxGauges)"
      - event: "MinIncentiveDurationSet(uint48 minIncentiveDuration)"
      - event: "LocalVotingEnabledSet(bool enabled)"
  - name: AeroVotingRewardsManager
    handler: src/EventHandlers/Aero/AeroVotingRewardsManager.ts
    events:
      - event: "FeesCollected(address indexed gauge, address indexed token, uint256 amount)"
      # Allocator rewards (phase 3)
      - event: "ClaimFees(uint256 indexed tokenId, address indexed recipient, address indexed token, uint256 amount)"
      - event: "ClaimIncentives(uint256 indexed tokenId, address indexed recipient, uint256 indexed programId, uint256 amount)"
      - event: "IncentiveCreated(uint256 indexed programId, address indexed token, address indexed creator, uint256 amount, uint48 start, uint48 duration)"
      - event: "IncentiveSwept(uint256 indexed programId, address indexed creator, uint256 amount)"
  # --- Aero governance: sAERO, allocations, Minter, redemptions, migration (phase 3, ADR 0006) ---
  # Root contracts, Base only (root-base.json, migration-base.json); the
  # Velodrome migration also on Optimism (migration-optimism.json).
  # Signatures from the MIT interfaces (IVotingEscrow, IVotes, IVoter,
  # IMinter, IRootEmissionsHandler, IMigration, IVelodromeMigrationEntrypoint),
  # each checked against real logs.
  - name: AeroVotingEscrow
    handler: src/EventHandlers/Aero/AeroVotingEscrow.ts
    events:
      - event: "Transfer(address indexed from, address indexed to, uint256 indexed tokenId)"
      - event: "Deposit(address indexed provider, uint256 indexed tokenId, uint8 indexed depositType, uint128 value, uint256 unstakeTime, uint256 ts)"
      - event: "Withdraw(address indexed provider, uint256 indexed tokenId, uint128 value, uint256 ts)"
      - event: "UpgradeToPermanentStake(address indexed owner, uint256 indexed tokenId, uint128 amount, uint256 ts)"
      - event: "DowngradeFromPermanentStake(address indexed owner, uint256 indexed tokenId, uint128 amount, uint256 ts)"
      - event: "Supply(uint128 supply)"
      - event: "Rebalance((uint256 tokenId, uint128 amount)[] sources, (uint256 tokenId, uint128 amount, address recipient)[] destinations)"
      - event: "Burn(uint128 amount)"
  - name: AeroVoter
    handler: src/EventHandlers/Aero/AeroVoter.ts
    events:
      - event: "ParkedOnChain0(uint256 indexed tokenId, uint128 amount)"
      - event: "ChainsAllocated(uint256 indexed tokenId, (uint256 chainId, uint128 delta, uint256 gasLimit, uint256 value)[] allocations)"
      - event: "GaugesAllocated(uint256 indexed tokenId, uint256 indexed chainId, (address gauge, uint128 allocated, bytes data)[] gauges)"
      - event: "DeallocationProcessed(uint256 indexed chainId, uint256 indexed tokenId, uint128 amount)"
      - event: "EmergencyDeallocated(uint256 indexed chainId, uint256 indexed tokenId, uint128 amount)"
      - event: "TokenCleared(uint256 indexed tokenId, uint256[] clearedChains)"
      - event: "Chain0Rebalanced((uint256 tokenId, uint128 amount)[] sources, (uint256 tokenId, uint128 amount, address recipient)[] destinations)"
      - event: "Burned(address indexed caller, uint128 amount)"
      - event: "RedeemProcessed(uint256 indexed chainId, address indexed recipient, uint256 amount, uint256 surplusReported)"
      - event: "Donated(uint256 indexed chainId, address indexed donor, uint256 amount)"
      - event: "BufferDrawn(uint256 indexed chainId, uint256 amount)"
      - event: "SurplusSpent(uint256 indexed chainId, address indexed recipient, uint256 amount)"
      - event: "ChainRegistered(uint256 indexed chainId)"
      - event: "ChainStatusSet(uint256 indexed chainId, uint8 status)"
      - event: "EmergencyDeallocationAllowedSet(uint256 indexed chainId, bool allowed)"
  - name: AeroMinter
    handler: src/EventHandlers/Aero/AeroMinter.ts
    events:
      - event: "Minted(address indexed recipient, uint256 amount, uint256 splitterShare)"
      - event: "BaseRateSet(uint232 baseRate)"
      - event: "DynamicRateSet(uint256 rate)"
      - event: "TeamRateSet(uint24 teamRate)"
      - event: "RateBandSet(uint24 floorPips, uint24 ceilingPips)"
      - event: "MaxBaseRateChangePipsSet(uint24 maxBaseRateChangePips)"
      - event: "BaseRateUpdateCooldownSet(uint48 baseRateUpdateCooldown)"
      - event: "OperatorSet(address indexed operator)"
      - event: "FEDSet(address indexed fed)"
      - event: "DynamicRateModuleSet(address module)"
  - name: AeroRootEmissionsHandler
    handler: src/EventHandlers/Aero/AeroVoter.ts
    events:
      - event: "RedeemDeferred(address indexed recipient, uint256 amount, uint256 pendingTotal)"
  - name: AeroMigration
    handler: src/EventHandlers/Aero/AeroMigration.ts
    events:
      - event: "VeNFTMigrated(address indexed depositor, address indexed recipient, uint256 indexed v2TokenId, uint256 amount, uint256 out, bool permanent, bool liquid)"
      - event: "LiquidMigrated(address indexed depositor, address indexed recipient, uint256 amountIn, uint256 out)"
  - name: AeroMigrationEntrypoint
    handler: src/EventHandlers/Aero/AeroMigration.ts
    events:
      - event: "Migrated(uint64 indexed nonce, address indexed recipient, uint256 tokenAmount, bool isLiquid)"
  # Aero CustomUnstakedFeeModule (Slipstream V3): same CustomFeeSet as the
  # legacy UnstakedFeeModule, same semantics (0 = default, 420 = 0%).
  - name: AeroUnstakedFeeModule
    abi_file_path: abis/UnstakedFeeModule.json
    handler: src/EventHandlers/Aero/AeroUnstakedFeeModule.ts
    events:
      - event: CustomFeeSet
  - name: Voter
    abi_file_path: abis/VoterV2.json
    handler: src/EventHandlers/Voter/Voter.ts
    events:
      - event: Voted
      - event: Abstained
      - event: DistributeReward
      - event: GaugeCreated
      - event: GaugeKilled
      - event: GaugeRevived
      - event: WhitelistToken
  - name: SuperchainLeafVoter
    abi_file_path: abis/SuperchainLeafVoter.json
    handler: src/EventHandlers/Voter/SuperchainLeafVoter.ts
    events:
      - event: GaugeCreated
      - event: GaugeKilled
      - event: GaugeRevived
      - event: WhitelistToken
  - name: FeesVotingReward
    abi_file_path: abis/FeesVotingReward.json
    handler: src/EventHandlers/VotingReward/FeesVotingReward.ts
    events:
      - event: ClaimRewards
  - name: BribesVotingReward
    abi_file_path: abis/BribesVotingReward.json
    handler: src/EventHandlers/VotingReward/BribesVotingReward.ts
    events:
      - event: ClaimRewards
  - name: SuperchainIncentiveVotingReward
    abi_file_path: abis/SuperchainIncentiveVotingReward.json
    handler: src/EventHandlers/VotingReward/SuperchainIncentiveVotingReward.ts
    events:
      - event: ClaimRewards
  - name: CLGaugeFactoryV2
    abi_file_path: abis/CLGaugeFactoryV2.json
    handler: src/EventHandlers/CLGaugeFactory/CLGaugeFactoryV2.ts
    events:
      - event: SetDefaultCap
      - event: SetEmissionCap
  - name: CLGaugeFactoryV3
    abi_file_path: abis/CLGaugeFactoryV3.json
    handler: src/EventHandlers/CLGaugeFactory/CLGaugeFactoryV3.ts
    events:
      - event: SetDefaultCap
      - event: SetEmissionCap
      - event: SetDefaultMinStakeTime
      - event: SetPoolMinStakeTime
      - event: SetPenaltyRate
  - name: CLGauge
    abi_file_path: abis/CLGauge.json
    handler: src/EventHandlers/Gauges/CLGauge.ts
    events:
      - event: Deposit
      - event: Withdraw
      - event: ClaimRewards
      # Gauges V3 (min stake time): an early unstake forfeits part of the
      # staker's rewards to the Minter, in the same tx.
      - event: EarlyWithdrawPenalty
  - name: Gauge
    abi_file_path: abis/Gauge.json
    handler: src/EventHandlers/Gauges/Gauge.ts
    events:
      - event: Deposit
      - event: Withdraw
      - event: ClaimRewards
  - name: ALMDeployFactoryV2
    abi_file_path: abis/ALM/DeployFactoryV2.json
    handler: src/EventHandlers/ALM/DeployFactoryV2.ts
    events:
      - event: StrategyCreated
  - name: ALMDeployFactoryV1
    abi_file_path: abis/ALM/DeployFactoryV1.json
    handler: src/EventHandlers/ALM/DeployFactoryV1.ts
    events:
      - event: StrategyCreated
  - name: ALMCore
    abi_file_path: abis/ALM/Core.json
    handler: src/EventHandlers/ALM/Core.ts
    events:
      - event: Rebalance
  - name: ALMLPWrapperV2
    abi_file_path: abis/ALM/LPWrapperV2.json
    handler: src/EventHandlers/ALM/LPWrapperV2.ts
    events:
      - event: Deposit
      - event: Withdraw
      - event: Transfer
      - event: TotalSupplyLimitUpdated
  - name: ALMLPWrapperV1
    abi_file_path: abis/ALM/LPWrapperV1.json
    handler: src/EventHandlers/ALM/LPWrapperV1.ts
    events:
      - event: Deposit
      - event: Withdraw
      - event: Transfer
  - name: DynamicSwapFeeModule
    abi_file_path: abis/DynamicSwapFeeModule.json
    handler: src/EventHandlers/SwapFeeModule/DynamicSwapFeeModule.ts
    events:
      - event: CustomFeeSet
      - event: SecondsAgoSet
      - event: ScalingFactorSet
      - event: FeeCapSet
  - name: CustomSwapFeeModule
    abi_file_path: abis/CustomSwapFeeModule.json
    handler: src/EventHandlers/SwapFeeModule/CustomSwapFeeModule.ts
    events:
      - event: SetCustomFee
  - name: UnstakedFeeModule
    abi_file_path: abis/UnstakedFeeModule.json
    handler: src/EventHandlers/SwapFeeModule/UnstakedFeeModule.ts
    events:
      - event: CustomFeeSet
  - name: CustomUnstakedFeeModule
    abi_file_path: abis/CustomUnstakedFeeModule.json
    handler: src/EventHandlers/SwapFeeModule/CustomUnstakedFeeModule.ts
    events:
      - event: SetCustomFee
  - name: CLPoolLauncher
    handler: src/EventHandlers/PoolLauncher/CLPoolLauncher.ts
    abi_file_path: abis/CLPoolLauncher.json
    events:
      - event: Launch
      - event: Migrate
      - event: EmergingFlagged
      - event: EmergingUnflagged
      - event: PairableTokenAdded
      - event: PairableTokenRemoved
      - event: NewPoolLauncherSet
      - event: CreationTimestampSet
  - name: V2PoolLauncher
    handler: src/EventHandlers/PoolLauncher/V2PoolLauncher.ts
    abi_file_path: abis/V2PoolLauncher.json
    events:
      - event: Launch
      - event: Migrate
      - event: EmergingFlagged
      - event: EmergingUnflagged
      - event: PairableTokenAdded
      - event: PairableTokenRemoved
      - event: NewPoolLauncherSet
      - event: CreationTimestampSet
  - name: VelodromeUniversalRouter
    handler: src/EventHandlers/SuperswapsHyperlane/VelodromeUniversalRouter.ts
    abi_file_path: abis/VelodromeUniversalRouter.json
    events:
      - event: UniversalRouterBridge
      - event: CrossChainSwap
  - name: Mailbox
    handler: src/EventHandlers/SuperswapsHyperlane/Mailbox.ts
    abi_file_path: abis/Mailbox.json
    events:
      - event: DispatchId
      - event: ProcessId
  - name: Redistributor
    abi_file_path: abis/Redistributor.json
    handler: src/EventHandlers/Redistributor/Redistributor.ts
    events:
      - event: Deposited
      - event: Redistributed
      - event: SetKeeper
      - event: SetUpkeepManager
chains:
  - id: 10 # Optimism
    # RPC fallback: takes over at the head when HyperSync stalls (it did on Lisk,
    # Swell and Superseed in 2026). Ignored when the variable is unset.
    rpc:
      - url: ${ENVIO_OPTIMISM_RPC_URL:-}
        for: fallback
    start_block: 0
    contracts:
      # Aero (MetaDEX): deployment-addresses/{cl,pools,leaf}-<chain>.json
      - name: AeroCLFactory
        address:
          - 0xfeaB42D90055db3a0616249f76B6002D72266778
      - name: AeroStablePoolFactory
        address:
          - 0x78589E876edcEbdce72ee3436ab3c9AD3a7cEF2D
      - name: AeroVolatilePoolFactory
        address:
          - 0x8E6a9FCd1d638CC760Ffba397605Fe3355dE76D2
      - name: AeroNFPM
        address:
          - 0x4857DB576eE0e45F10525eC59527BfD10beeC60b
      - name: DynamicSwapFeeHook
        address:
          - 0xC0ed888AfE87ed1AcF01D9f19bB850159e3ce434
      - name: AeroTokenRegistry
        address:
          - 0x564665E023390097f46EA9662a6061a5d700A7E1
      # Aero gauges and emissions (phase 2): deployment-addresses/{leaf,gaugestack,cl}-<chain>.json
      - name: AeroGaugeManager
        address:
          - 0xbF234b32c5e58868243A4a14831626f3EdE7b183
      - name: AeroLeafVoter
        address:
          - 0x382409fad8503FbCdbB27A4211551fa03e884078
      - name: AeroCLGaugeFactory
        address:
          - 0xf437f62053ACB121665b8fDBfeA8F214FB8E589d
      - name: AeroV2GaugeFactory
        address:
          - 0x3924b18EDd37267dab6eDd99a3Bb339bf2b668fD # stable pools
          - 0x1B5D13975371806D699dC616A96D15B8eD26e5Ca # volatile pools
      - name: AeroUnstakedFeeModule
        address:
          - 0xcc421483cd131a8FD6b68c37E46f244dbec4F797
      - name: AeroCLGauge
        address:
      - name: AeroV2Gauge
        address:
      - name: AeroVotingRewardsManager
        address:
      # Aero migration (phase 3): migration-optimism.json
