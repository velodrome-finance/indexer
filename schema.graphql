# Entity that tracks the latest state of the token entity
# By nature this entity saves the latest state of the token, and its state at different times should be attained from the snapshot entities
type Token {
  id: ID! # Format: {chainId}-{address} (TokenId)
  address: String! @index # token address
  symbol: String! # token symbol
  name: String! # token name
  chainId: Int! @index # chain id
  decimals: BigInt! @config(precision: 76) # number of decimals
  pricePerUSDNew: BigInt! @config(precision: 76) # price of token per USD
  lastUpdatedTimestamp: Timestamp! # timestamp of last price refresh attempt (drives the once-per-clock-hour throttle; see src/PriceOracle.ts)
  lastSuccessfulPriceTimestamp: Timestamp # timestamp of last successful price (pinned / pool route / canonical source / canonical seed); drives the 7-day carry window (#694, docs/adr/0003)
  pricingDepthUSD: BigInt @config(precision: 76) # USD depth (1e18-base) behind pricePerUSDNew: the counterparty-side reserve of the pool that priced it, or the canonical source's own depth; kept while carried, unset when pinned / unpriced / overridden. Lets a cross-chain canonical source be compared with local pools (docs/adr/0004)
  isWhitelisted: Boolean! # whether the token is whitelisted by the legacy Voter / SuperchainLeafVoter (WhitelistToken)
  # Aero listing: the latest ListingSet of the chain's Aero TokenRegistry (Aero's curated token list,
  # the successor of the legacy whitelist). Null when the registry never emitted one for the token.
  # A positive price-trust signal like isWhitelisted (priceTrustReason LISTED, ADR 0005).
  isListedOnAero: Boolean

  # Price-trust gate per-token decision surface (issue #755 slice 2). Populated
  # at every Token construction site (Voter.WhitelistToken, SuperchainLeafVoter
  # .WhitelistToken, PriceOracle.createTokenEntity, VotingReward reward-token
  # bootstrap) via `PriceTrust.getGateDecisionFromSignals`; subsequent refreshes
  # preserve the stamped values via spread until slice-3+ aggregator paths
  # re-evaluate via `PriceTrust.getGateDecision` at consume time. Null only on
  # rows that predate the field's introduction.
  #
  # Stored as String (not enum) so values can extend without an Envio schema
  # migration. The TypeScript value sets are pinned by the `PRICE_TRUST_OUTCOME`
  # / `PRICE_TRUST_REASON` const objects in `src/PriceTrust.ts` — call sites
  # should reference those constants rather than bare string literals.
  #
  # Trusted-USD aggregates are written into the existing `*USD` fields on Pool
  # — no `*USDTrusted` companion fields. Per-chain rollback uses the migration
  # mode flag introduced in slice 4; A/B comparison against pre-gate values is
  # done offline via the diff script (issue #755 US #19).
  priceTrustOutcome: String
  priceTrustReason: String # Reason code paired with priceTrustOutcome; values pinned by PRICE_TRUST_REASON in src/PriceTrust.ts (see priceTrustOutcome).
}

# Snapshot of the Token entity, written at most once per token per clock hour
# by the price refresh in src/PriceOracle.ts (docs/adr/0003-pool-derived-token-prices.md).
type TokenPriceSnapshot @storage(postgres: false, clickhouse: true) {
  id: ID! # Format: {chainId}-{address}-{epochMs} (TokenPriceSnapshotId; epochMs = hour bucket of the refresh). Rows written before ADR 0003 used {chainId}-{address}-{blockNumber}.
  address: String! @index # Address of the token
  pricePerUSDNew: BigInt! @config(precision: 76) # price of token per USD
  chainId: Int! # chain id
  isWhitelisted: Boolean! # whether the token is whitelisted
  lastUpdatedTimestamp: Timestamp! @index # Timestamp of the last update
  # Provenance of pricePerUSDNew for this tick (ADR 0003): `pinned` (stablecoin /
  # destination token at exactly $1), `pool` (derived from the deepest qualifying
  # pool; see pricingPoolId / pricingDepthUSD), `canonical` (the same asset's
  # price on its canonical chain won the depth comparison; see
  # pricingSourceTokenId / pricingDepthUSD, ADR 0004), `canonical-seed` (no
  # route qualified and the live canonical source was outside its ±2 h window:
  # the committed hourly seed's price of pricingSourceTokenId for
  # pricingSeedHour, ADR 0008), `override` (operator
  # blacklist -> 0), `carried` (no route qualified; prior price kept, last
  # success < 7 days ago, any tier; see
  # lastSuccessfulPriceTimestamp) or `unpriced` (no route qualified and nothing fresh to
  # carry -> 0). Earlier rows may carry `rebind` (ADR 0003 fallback copy) or the
  # oracle-era tags `fresh` / `pool-implied`, or no tag at all.
  # Stored as String (not an enum) so the set can extend without an Envio schema
  # migration; the value set is pinned by PRICE_SOURCE in src/Snapshots/TokenPriceSnapshot.ts.
  priceSource: String
  pricingPoolId: String # Pool id ({chainId}-{poolAddress}) the price was derived through; set only when priceSource = `pool`
  pricingDepthUSD: BigInt @config(precision: 76) # USD depth (1e18-base) of the winning candidate: pricingPoolId's counterparty-side reserve, or the canonical source token's stored depth; set only when priceSource = `pool` or `canonical`
  pricingSourceTokenId: String # Token id ({chainId}-{address}) of the canonical source whose price was used; set only when priceSource = `canonical` (its stored price) or `canonical-seed` (its seed price)
  pricingHops: Int # Route length when priceSource = `pool` / `canonical`: 1 = direct (pool against a lower-tier token, or canonical source), 2 = two-hop through a tier-3 peer that has a direct pool route (ADR 0007); then pricingPoolId is the peer pool and pricingDepthUSD the weaker of the two hops
  pricingViaTokenId: String # Two-hop only: token id ({chainId}-{address}) of the tier-3 peer the price went through
  pricingViaPoolId: String # Two-hop only: pool id of the peer's own direct route
  lastSuccessfulPriceTimestamp: Timestamp # When the price in this row was last obtained: the row's own time on `pinned` / `pool` / `canonical` rows, older on `carried` rows (up to 7 days, any tier; ADR 0007); null on rows written before it existed
  pricingSeedHour: Timestamp # Start of the seed hour whose price was used; set only when priceSource = `canonical-seed` (src/constants/canonical_price_seed.json, ADR 0008)
}

# Per-token list of pools the token can be priced through (ADR 0003). A pool is
# appended at creation (V2 PoolFactory / CL CLFactory PoolCreated) for each side
# whose counterparty sits in a strictly lower pricing tier, so the lists stay
# small (only connector-side pools qualify) and pricing is acyclic. Handler-only
# scratch state: never on Token, never in ClickHouse, hidden from the API.
type TokenPricingPools @storage(postgres: true, clickhouse: false) @internal {
  id: ID! # Format: {chainId}-{address} (TokenId); the same id as the Token it belongs to
  pools: [String!]! # Pool ids ({chainId}-{poolAddress}), in creation order
}

# Tracks relevant data for each NFT minted: each NFT represents a concentrated position in a pool
# Note: amount0, amount1, amountUSD are derived fields computed on-demand from liquidity + sqrtPriceX96 + ticks
type NonFungiblePosition {
  id: ID! # Format: {chainId}-{nfpmAddress}-{tokenId} (NonFungiblePositionId). Natural key is (NFPM, tokenId); pool is metadata and preserved as a field. nfpmAddress disambiguates intra-chain tokenId collisions across multiple NFPMs (e.g. Optimism has two).
  chainId: Int! # Chain ID where the NFT exists
  tokenId: BigInt! @index # Token ID of the NFT (from Transfer event)
  nfpmAddress: String! @index # Address of the NFPM contract that emitted the Transfer (a legacy NFPM or the Aero NFPM); disambiguates intra-chain tokenId collisions across multiple NFPMs (e.g. Optimism has two)
  owner: String! @index # Checksum address of the current owner (from Transfer event)
  pool: String! @index # Address of the CL pool this position belongs to
  tickUpper: BigInt! @config(precision: 24) # Upper tick of the position range
  tickLower: BigInt! @config(precision: 24) # Lower tick of the position range
  token0: String! # Address of token0 in the position
  token1: String! # Address of token1 in the position
  liquidity: BigInt! @config(precision: 76) # Current liquidity value of the position
  mintTransactionHash: String! @index # Transaction hash of the NFT mint transaction
  mintLogIndex: Int! # Log index of the CLPool.Mint the position was created from (legacy NFPMs: matched at NFPM.Transfer; Aero NFPM: matched at IncreaseLiquidity by range, liquidity and amounts)
  lastUpdatedTimestamp: Timestamp! # Timestamp of last update
  lastSnapshotTimestamp: Timestamp # nullable - null means never snapshotted
  isStakedInGauge: Boolean! # Set from NFPM.Transfer to/from the pool's gauge; owner is not updated on gauge transfers so we need this to know staked vs not. Works the same for Aero positions: Pool.gaugeAddress is set from the Aero gauge factory (ADR 0006)
}

# Snapshot of NonFungiblePosition at an epoch (full state for historical queries / recomputation)
type NonFungiblePositionSnapshot @storage(postgres: false, clickhouse: true) {
  id: ID! # Format: {chainId}-{nfpmAddress}-{tokenId}-{epochMs} (NonFungiblePositionSnapshotId). nfpmAddress disambiguates intra-chain tokenId collisions across multiple NFPMs (e.g. Optimism has two).
  chainId: Int! # chain id where the NFT exists
  tokenId: BigInt! @index # token ID of the NFT
  nfpmAddress: String! @index # address of the NFPM contract that emitted the Transfer
  owner: String! @index # checksum address of the owner at snapshot time
  pool: String! @index # address of the CL pool this position belongs to
  tickLower: BigInt! @config(precision: 24) # lower tick of the position range
  tickUpper: BigInt! @config(precision: 24) # upper tick of the position range
  token0: String! # address of token0 in the position
  token1: String! # address of token1 in the position
  liquidity: BigInt! @config(precision: 76) # liquidity value of the position at snapshot time
  mintTransactionHash: String! @index # transaction hash of the NFT mint transaction
  mintLogIndex: Int! # log index of the CLPool.Mint event (for placeholder matching)
  lastUpdatedTimestamp: Timestamp! # timestamp of last update before this snapshot
  isStakedInGauge: Boolean! # whether the position is staked in the pool's gauge at snapshot time
  timestamp: Timestamp! @index # snapshot epoch timestamp
}

type VeNFTState {
  id: ID! # Format: {chainId}-{tokenId} (VeNFTId)
