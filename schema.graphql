  newLocker: String! # target locker from migration
  lastMigratedAt: Timestamp! # timestamp of the most recent migration

  poolStats: [Pool!]! @derivedFrom(field: "poolLauncherPoolId") # reverse relation: Pool aggregates launched under this PoolLauncherPool
}

type PoolLauncherConfig {
  id: ID! # Format: {chainId}-{poolLauncherAddress} (PoolId with launcher contract as address)
  version: String! # "CL" for concentrated liquidity, "V2" for V2 pools
  pairableTokens: [String!]! # Whitelisted tokens an emerging-token pool may be paired against on this launcher
}

# A superswap is characterized by 3 steps:
# 1. Original asset is swapped for oUSDT on the source chain.
# 2. The oUSDT is then bridged through Hyperlane to the destination chain.
# 3. Bridged oUSDT is then swapped into the preferred asset on the destination chain.
type SuperSwap {
  id: ID! # Format: {messageId} — globally unique Hyperlane message identifier
  originChainId: BigInt! @config(precision: 24) # Chain ID where the swap originated
  destinationChainId: BigInt! @config(precision: 24) # Resolved EVM chain ID of the swap target/recipient (mapped from the Hyperlane domain via domainToChainId)
  sender: String! # Original sender address initiating the swap
  recipient: String! # The recipient address on the destination chain
  oUSDTamount: BigInt! @config(precision: 76) # Amount of oUSDT swapped (already normalized to token decimals)
  sourceChainToken: String! # Token that gets swapped by oUSDT on source chain, i.e., Token A -> oUSDT on source chain
  sourceChainTokenAmountSwapped: BigInt! @config(precision: 76) # Amount of sourceChainToken that was swapped for oUSDT on the source chain
  destinationChainToken: String! # Token that gets swapped by oUSDT on destination chain, i.e., oUSDT -> Token B on destination chain
  destinationChainTokenAmountSwapped: BigInt! @config(precision: 76) # Amount of destinationChainToken that was received from swapping oUSDT on the destination chain
  timestamp: Timestamp! # Block timestamp of the swap event
}

type OUSDTBridgedTransaction {
  id: ID! # Format: transaction hash (unique per bridge tx)
  transactionHash: String! @index # Transaction hash
  originChainId: BigInt! @config(precision: 24) # Chain ID where the bridge transaction originated
  destinationChainId: BigInt! @config(precision: 24) # Resolved EVM chain ID the bridge transaction is destined for (mapped from the Hyperlane domain via domainToChainId)
  sender: String! # Address that initiated the bridge transaction
  recipient: String! # Address that will receive the bridged tokens
  amount: BigInt! @config(precision: 76) # Amount of oUSDT tokens being bridged
}

# Registering each event related from/to oUSDT. Needed for filtering and eventual registration of source/destination token
# and corresponding amounts during superswaps execution
type OUSDTSwaps {
  id: ID! # Format: {transactionHash}_{chainId}_{tokenInPool}_{amountIn}_{tokenOutPool}_{amountOut}
  transactionHash: String! @index # Transaction hash of the swap transaction
  tokenInPool: String! # Token that goes into the pool after swap
  tokenOutPool: String! # Token that goes out of the pool after swap
  amountIn: BigInt! @config(precision: 76) # Amount of tokenInPool being swapped into the pool
  amountOut: BigInt! @config(precision: 76) # Amount of tokenOutPool being swapped out of the pool
}

# Stores chain-wide CLGauge config data — default emissions cap, default
# min-stake-time, and penalty rate. Keyed by chainId so the CLFactory.PoolCreated
# handler can resolve it with a direct get() without a per-chain lookup constant.
# Last-writer-wins across gauge factory generations (V2, V3, ...) — the row
# reflects the most recent chain-wide defaults.
type CLGaugeConfig {
  id: ID! # Format: stringified chainId (e.g. "8453" for Base)
  defaultEmissionsCap: BigInt! @config(precision: 24) # Chain-wide default gauge emissions cap; applied when a pool's gauge has no SetEmissionsCap override.
  defaultMinStakeTime: BigInt! @config(precision: 24) # Chain-wide default LP stake lockup (seconds), set via CLGaugeFactoryV3.SetDefaultMinStakeTime. 0 before V3.
  penaltyRate: BigInt! @config(precision: 24) # Early-unstake penalty rate in basis points, set via CLGaugeFactoryV3.SetPenaltyRate. 0 before V3.
  lastUpdatedTimestamp: Timestamp! # Timestamp of the last CLGaugeConfig update
}

# Keyed by the Hyperlane messageId, which is globally unique (keccak256 of the
# packed message, including origin domain and the origin Mailbox's nonce), so
# the ProcessId consumer resolves it with a primary-key read.
type DispatchId_event @storage(postgres: true, clickhouse: false) @internal {
  id: ID! # Format: {messageId}
  chainId: Int! # Chain ID where the message was dispatched (origin chain)
  transactionHash: String! # Transaction hash of the dispatch transaction
  messageId: String! # Unique message ID identifying the cross-chain message in Hyperlane
}

# Keyed by the Hyperlane messageId: a Mailbox delivers a message at most once.
type ProcessId_event @storage(postgres: true, clickhouse: false) @internal {
  id: ID! # Format: {messageId}
  chainId: Int! # Chain ID where the message was processed (destination chain)
  transactionHash: String! # Transaction hash of the process transaction
  messageId: String! # Unique message ID identifying the cross-chain message in Hyperlane (matches DispatchId messageId)
}

# Per-transaction registry of the messageIds dispatched in a tx, so the
# CrossChainSwap / ProcessId consumers find a source tx's DispatchId_event rows
# with primary-key reads instead of DispatchId_event.getWhere({ transactionHash }).
# Append-only: consumers PK-get each DispatchId_event and skip consumed
# (deleted) ones; the row is deleted once every listed message is consumed.
type TxDispatchIdRegistry
  @storage(postgres: true, clickhouse: false)
  @internal
{
  id: ID! # Format: {transactionHash}
  messageIds: [String!]! # DispatchId_event ids (= messageIds) dispatched in this tx, in processing order
}

# The first oUSDT swap recorded in a transaction, so the SuperSwap stitching
# resolves "the oUSDT swap of tx X" with a primary-key read instead of
# OUSDTSwaps.getWhere({ transactionHash })[0]. Written only when absent, so it
# holds the first swap in processing order (the row getWhere returned first).
type TxOUSDTSwapRegistry @storage(postgres: true, clickhouse: false) @internal {
  id: ID! # Format: {transactionHash}
  swapId: String! # OUSDTSwaps id of the first oUSDT swap recorded in this tx
  tokenInPool: String! # Copy of OUSDTSwaps.tokenInPool
  tokenOutPool: String! # Copy of OUSDTSwaps.tokenOutPool
  amountIn: BigInt! @config(precision: 76) # Copy of OUSDTSwaps.amountIn
  amountOut: BigInt! @config(precision: 76) # Copy of OUSDTSwaps.amountOut
}

type ALM_TotalSupplyLimitUpdated_event
  @storage(postgres: true, clickhouse: false)
  @internal
{
  id: ID! # Format: {chainId}-{lpWrapperAddress} (ALMLPWrapperId)
  lpWrapperAddress: String! # LP Wrapper associated to the event
  currentTotalSupplyLPTokens: BigInt! @config(precision: 76) # Current supply of LP tokens for the pool, emitted by the event
  transactionHash: String! # Transaction hash of the event
}

type RootPool_LeafPool {
  id: ID! # Format: {rootChainId}-{leafChainId}-{rootPoolAddress}-{leafPoolAddress} (RootPoolLeafPoolId)
  rootChainId: Int! # Optimism chain ID
  rootPoolAddress: String! @index # Placeholder contract that isn't a real pool (i.e., doesn't allow for LP, swap, etc). Mainly just for registring purposes
  leafChainId: Int! # Chain ID where the actual real pool (i.e. pool where it is possible to LP, swap, etc) is deployed
  leafPoolAddress: String! # Actual real pool that is deployed on leaf chain
}

# Maps root gauge (RootGauge/RootCLGauge on OP) to root pool for DistributeReward cross-chain resolution
type RootGauge_RootPool {
  id: ID! # Unique identifier, formatted as {rootChainId}-{rootGaugeAddress}
  rootChainId: Int! # Chain ID of the root chain (typically Optimism)
  rootGaugeAddress: String! @index # Address of the root gauge contract on the root chain
  rootPoolAddress: String! # Address of the root pool this gauge maps to
}

# Deferred vote: stored when Voted/Abstained fires but RootPool_LeafPool mapping does not exist yet
type PendingVote @storage(postgres: true, clickhouse: false) @internal {
  id: ID! # Format: {chainId}-{rootPoolAddress}-{tokenId}-{txHash}-{logIndex}
  chainId: Int! # Chain ID for which the vote was intended
  rootPoolAddress: String! @index # Address of the root pool being voted on
  tokenId: BigInt! @config(precision: 76) # veNFT Token ID that cast the vote
  weight: BigInt! @config(precision: 76) # Weight of the vote in veToken units
  eventType: String! # "Voted" | "Abstained"
  timestamp: Timestamp! # Timestamp when the vote event occurred
  blockNumber: BigInt! @config(precision: 76) # Block number in which the vote was submitted
  transactionHash: String! # Transaction hash of the vote event
}

# Deferred CL pool initialization state: stored when CLPool.Initialize fires
# BEFORE CLFactory.PoolCreated has created the Pool.
# Aerodrome Slipstream emits Initialize from the pool inside the same tx as
# (and at a LOWER log index than) PoolCreated from the factory, so Envio
# delivers Initialize first. PoolCreated reads this buffer when constructing
# the new aggregator and deletes the entry afterwards.
type CLPoolPendingInitialize
  @storage(postgres: true, clickhouse: false)
  @internal
{
  id: ID! # Format: {chainId}-{poolAddress} (PoolId)
  chainId: Int! # chain id
  poolAddress: String! # address of the CL pool awaiting PoolCreated
  sqrtPriceX96: BigInt! @config(precision: 76) # initial sqrt price (Q96 fixed point) from the Initialize event
  tick: BigInt! @config(precision: 24) # initial tick from the Initialize event
}

# Deferred RootPool->LeafPool mapping: stored when RootPoolCreated fires but no Pool exists yet
type PendingRootPoolMapping
  @storage(postgres: true, clickhouse: false)
  @internal
{
  id: ID! # Format: {rootChainId}-{rootPoolAddress}
  rootChainId: Int! # Chain ID where the root pool exists (typically Optimism)
  rootPoolAddress: String! # Address of the root pool (matches RootPool_LeafPool)
  rootFactoryAddress: String! # RootCLPoolFactory that emitted RootPoolCreated; only a leaf pool created by the leaf CLFactory at this same address may claim the mapping
  leafChainId: Int! # Chain ID where the leaf pool will be created
  token0: String! # Address of token0 in the root/leaf pool
  token1: String! # Address of token1 in the root/leaf pool
  tickSpacing: BigInt! @config(precision: 24) # Tick spacing assigned for the pool
  rootPoolMatchingHash: String! @index # {leafChainId}_{token0}_{token1}_{tickSpacing}  # Used for quick matching in Pool
}

# Deferred distribution: stored when DistributeReward fires for a root gauge but RootPool_LeafPool mapping does not exist yet
type PendingDistribution @storage(postgres: true, clickhouse: false) @internal {
  id: ID! # Format: {rootChainId}-{rootPoolAddress}-{blockNumber}-{logIndex}
  rootChainId: Int! # Chain ID where the root gauge and pool exist
  rootPoolAddress: String! @index # Address of the root pool (matches RootPool_LeafPool)
  gaugeAddress: String! # Gauge that emitted DistributeReward
  amount: BigInt! @config(precision: 76) # Reward amount from event
  blockNumber: BigInt! @config(precision: 76) # Block number of the event
  blockTimestamp: Timestamp! # Block timestamp of the event
  logIndex: Int! # Log index for uniqueness within block
}

# Default fee of a V2 pool factory for one pool type, from its SetDefaultFee events (leaf
# PoolFactory: SetDefaultFee(bool stable, uint256 fee); Aero stable / volatile factories:
# SetDefaultFee(uint256)). A pool without a custom fee is charged this. Factories that never
# emitted one (the Optimism and Base PoolFactory) use the 5 / 30 bps constants.
type PoolFactoryDefaultFee {
  id: ID! # Format: {chainId}-{factoryAddress}-{stable|volatile} (PoolFactoryDefaultFeeId)
  chainId: Int! # chain id
  factoryAddress: String! @index # V2 pool factory that emitted SetDefaultFee
  isStable: Boolean! # pool type the default applies to
  fee: BigInt! @config(precision: 24) # default fee, FEE_SCALE 1e6 (the event's basis points x 100)
  lastUpdatedTimestamp: Timestamp! # block time of the latest SetDefaultFee
}

# Should be updated by TickSpacingEnabled event emitted by CLFactory contract
# It allows to initialise currentFee field for all CLPools
# CLPool fees can then be modified by either CustomSwapFeeModule or DynamicSwapFeeModule
# The same tick spacing can be enabled multiple times (to update the fee), so this entity is updated, not created new
# Keyed per CLFactory: a chain can have several CLFactories with different fees for the same
# tick spacing (on Arc, tick spacing 50 is 0.05% on the lite-launch CLFactory, 0.30% on the Aero one).
type FeeToTickSpacingMapping {
  id: ID! # Format: {chainId}-{factoryAddress}-{tickSpacing} (FeeToTickSpacingMappingId)
  chainId: Int! @index # chain id
  factoryAddress: String! @index # CLFactory (legacy CLFactory or AeroCLFactory) that emitted TickSpacingEnabled
  tickSpacing: BigInt! @config(precision: 24) @index # Tick spacing value
  fee: BigInt! @config(precision: 24) # Fee value for this tick spacing
  lastUpdatedTimestamp: Timestamp! # Timestamp when this mapping was last updated
}

# Per-tick liquidityNet maps of a CL pool, split off the Pool row: hot pools
# hold hundreds of entries, which every Pool read and write would otherwise
# (de)serialise, and envio writes a ClickHouse row per block in which an entity
# changes. Postgres only; read by CLPool Swap / Mint / Burn, the gauge stake
# paths and NFPM staked-position changes; written only when a map changes
# (Mint / Burn / stake / unstake / staked-position liquidity change, never a Swap).
#
# Each map is a pair of parallel arrays encoding Uniswap v3's per-tick
# liquidityNet: sorted ascending by tick, dedup'd, no zero-net entries, same
# length; (edges[i], nets[i]) is one (tick, net) pair. Two arrays instead of a
# list of structs because GraphQL lists only allow scalars or named types.
type PoolTickMap @storage(postgres: true, clickhouse: false) @internal {
  id: ID! # Same as the Pool id: {chainId}-{poolAddress} (PoolId)
  # All positions (CLPool Mint/Burn). Drives the fee-free swap reserve delta
  # (#803) and the swap-derived fee (src/Aggregators/CLSwapFee.ts).
  tickEdges: [BigInt!]!
  tickEdgeNets: [BigInt!]! # liquidityNet per tick in tickEdges
  # Staked positions only (gauge deposit / withdraw, NFPM liquidity changes of
  # staked positions). Drives the staked reserve deltas (#666/#719).
  stakedTickEdges: [BigInt!]!
  stakedTickEdgeNets: [BigInt!]! # staked liquidityNet per tick in stakedTickEdges
}

# Temporary entity for storing CLPool.Mint event data until consumed by NFPM.Transfer(mint)
# This is needed because NFPM.Transfer will create NonFungiblePosition entity for a mint (i.e. from = zero address)
# However, the transfer event doesn't have all the necessary data (e.g. tickLower, tickUpper, etc).
# This is where CLpoolMintEvent comes in
# Deleted immediately after consumption
type CLPoolMintEvent @storage(postgres: true, clickhouse: false) @internal {
  id: ID! # Format: {chainId}_{poolAddress}_{txHash}_{logIndex}
  chainId: Int! @index # chain id
  pool: String! @index # address of the CL pool the Mint fired on
  owner: String! # position owner from the Mint event
  tickLower: BigInt! @config(precision: 24) # lower tick of the minted range
  tickUpper: BigInt! @config(precision: 24) # upper tick of the minted range
  liquidity: BigInt! @config(precision: 76) # liquidity minted
  amount0: BigInt! @config(precision: 76) # raw token0 amount deposited
  amount1: BigInt! @config(precision: 76) # raw token1 amount deposited
  token0: String! # address of token0
  token1: String! # address of token1
  transactionHash: String! @index # transaction hash of the Mint event
  logIndex: Int! # log index of the Mint event within the transaction
  consumedByTokenId: BigInt @index # Set when consumed (null = unconsumed)
  createdAt: Timestamp! # timestamp the buffer row was created
}

# Tracks burned principal per CL position that hasn't been collected yet.
# Used to isolate actual swap fees from the CLPool Collect event, which emits
# a combined amount (burned principal + accumulated fees) in tokensOwed.
#
# Flow: Burn adds principal here → Collect subtracts it → remainder = fees.
# Keyed by contract-level position identity (pool + owner + tick range).
type CLPositionPendingPrincipal
  @storage(postgres: true, clickhouse: false)
  @internal
{
  id: ID! # {chainId}-{poolAddress}-{owner}-{tickLower}-{tickUpper}
  # Principal from Burn events not yet drained by Collect.
  # Accumulates across multiple Burns; reduced when Collect fires.
  pendingPrincipal0: BigInt! @config(precision: 76)
  pendingPrincipal1: BigInt! @config(precision: 76) # token1 counterpart of pendingPrincipal0 (see pendingPrincipal0).
}

# Aero NFPM position creation, step 1 of 2 (src/EventHandlers/NFPM/AeroNFPMLogic.ts).
# The Aero NFPM's IncreaseLiquidity carries the tick range but not the pool. A CLPool.Mint on
# an Aero pool whose owner is the pool's NFPM stores its pool here, keyed by every value the
# NFPM's IncreaseLiquidity repeats, so IncreaseLiquidity finds the pool by primary key (no scan,
# no positional guess). Deleted by that IncreaseLiquidity (mints and increases alike).
type AeroNFPMMintPool @storage(postgres: true, clickhouse: false) @internal {
  id: ID! # {chainId}-{txHash}-{nfpmAddress}-{tickLower}-{tickUpper}-{liquidity}-{amount0}-{amount1} (AeroNFPMMintPoolId)
  pools: [String!]! # CL pool address of each matching Mint in the tx, in log order (one entry unless two pools received identical mints)
  mintLogIndexes: [Int!]! # log index of each of those Mints (parallel to pools)
}

# Aero NFPM position creation, step 2 of 2: the recipient of NFPM.Transfer(mint), held until
# the same tx's IncreaseLiquidity creates the NonFungiblePosition (the Transfer has the owner
# but no range or pool; IncreaseLiquidity has the range but no owner). Deleted on creation.
type AeroNFPMPendingMint @storage(postgres: true, clickhouse: false) @internal {
  id: ID! # Same as the position's id: {chainId}-{nfpmAddress}-{tokenId} (NonFungiblePositionId)
  owner: String! # recipient of the mint Transfer
  transactionHash: String! # mint transaction
}

# V2 swap fee hand-over. A V2 pool emits Fees(sender, amount0, amount1) for the fee it takes
# on each input token, before the swap's Sync and Swap in the same transaction. The Fees
# handler adds the amounts here and the Swap handler reads (by primary key) and deletes them,
# so a swap's fee USD and effective rate come from the fee actually charged. Deleted by the Swap.
# Fees of an NFPM position (legacy NFPMs and the Aero NFPM), isolated by CLPool.Collect
# (whose `owner` is the NFPM contract) and handed to the NFPM's Collect that follows in
# the same tx, which credits them to the position's owner and deletes the row.
type NFPMCollectFeesInTx @storage(postgres: true, clickhouse: false) @internal {
  id: ID! # Format: {chainId}-{txHash}-{nfpmAddress} (NFPMCollectFeesInTxId)
  pool: String! # the CL pool whose Collect isolated the fees
  fees0: BigInt! @config(precision: 76) # raw token0 fees
  fees1: BigInt! @config(precision: 76) # raw token1 fees
  feesUSD: BigInt! @config(precision: 76) # USD of the fees at CLPool.Collect, 1e18
}

type V2SwapFeesInTx @storage(postgres: true, clickhouse: false) @internal {
  id: ID! # Format: {chainId}-{txHash}-{poolAddress} (V2SwapFeesInTxId)
  fee0: BigInt! @config(precision: 76) # raw token0 fee of the pending swap
  fee1: BigInt! @config(precision: 76) # raw token1 fee of the pending swap
}

# Per-transaction registry of CLPoolMintEvent IDs, used to skip the index scan
# on CLPoolMintEvent.getWhere({ transactionHash }) in the NFPM.Transfer(mint) consumer.
# The consumer knows chainId + txHash; it reads this row and then PK-gets each event by id.
# Cleaned up as events are consumed: ids are removed on consumption and the row is deleted
# when the last id is removed.
type TxCLPoolMintRegistry
  @storage(postgres: true, clickhouse: false)
  @internal
{
  id: ID! # Format: {chainId}-{txHash}
  mintEventIds: [String!]! # CLPoolMintEvent ids produced in this tx, in insertion order
}

# Per-(tx, pool) registry of PoolTransferInTx ids, used to skip the index scan
# on PoolTransferInTx.getWhere({ txHash }) in the Pool.Mint / Pool.Burn consumer.
# The consumer knows chainId + txHash + pool; it reads this row and then PK-gets
# each transfer by id. Rows are pruned on consumption and deleted when empty.
type TxPoolTransferRegistry
  @storage(postgres: true, clickhouse: false)
  @internal
{
  id: ID! # Format: {chainId}-{txHash}-{poolAddress}
  transferIds: [String!]! # PoolTransferInTx ids produced in this (tx, pool), in insertion order
}

# Temporary entity for matching Mint/Burn with Transfer events
# Only stores mint/burn transfers (isMint || isBurn) and LP returns (LP sent into
# the pool, both flags false; the Burn credits their `from`, #911) to reduce storage
type PoolTransferInTx @storage(postgres: true, clickhouse: false) @internal {
  id: ID! # Format: {chainId}-{txHash}-{poolAddress}-{logIndex}
  chainId: Int! @index # chain id
  txHash: String! @index # transaction hash containing the transfer
  pool: String! @index # address of the pool whose LP token was transferred
  logIndex: Int! # log index of the Transfer event within the transaction
  blockNumber: BigInt! # block number of the transfer
  from: String! # sender address (0x0 for mints)
  to: String! # recipient address (0x0 for burns)
  value: BigInt! @config(precision: 76) # LP token amount transferred
  isMint: Boolean! # from == 0x0
  isBurn: Boolean! # to == 0x0
  timestamp: Timestamp! # block timestamp of the transfer
}

# Temporary entity for matching Withdraw events with Transfer events (burns)
# Similar to PoolTransferInTx but for ALM LP Wrapper
# Only needed for burns (to = 0x0) since Deposit events emit the correct minted amount
# Needed for LPWrapper V1 Withdraw event handler fix
type ALMLPWrapperTransferInTx
  @storage(postgres: true, clickhouse: false)
  @internal
{
  id: ID! # Format: {chainId}-{txHash}-{wrapperAddress}-{logIndex}
  chainId: Int! @index # chain id
  txHash: String! @index # transaction hash containing the transfer
  wrapperAddress: String! @index # address of the ALM LP wrapper whose token was transferred
  logIndex: Int! # log index of the Transfer event within the transaction
  blockNumber: BigInt! # block number of the transfer
  from: String! # sender address (0x0 for mints)
  to: String! # recipient address (0x0 for burns)
  value: BigInt! @config(precision: 76) # LP token amount transferred
  isBurn: Boolean! # to == 0x0
  timestamp: Timestamp! # block timestamp of the transfer
}

# Singleton config state per Redistributor contract, updated by SetKeeper /
# SetUpkeepManager events. Last-writer-wins — the row reflects the most recent
# keeper / upkeep manager addresses.
#
# Redistributed and Deposited events are folded into Pool
# counters (totalEmissionsRedistributed / totalEmissionsForfeited) via a
# gauge→pool lookup; they have no dedicated entity.
type RedistributorConfig {
  id: ID! # Format: {chainId}-{redistributorAddress}
  chainId: Int! @index # chain id
  redistributorAddress: String! # Redistributor contract address
  keeper: String! # Current keeper address (empty string until SetKeeper fires)
  upkeepManager: String! # Current upkeep manager address (empty string until SetUpkeepManager fires)
  lastUpdatedTimestamp: Timestamp! # Timestamp of the last config update
}

# ============================================================================
# Aero (MetaDEX) gauges, staking and emissions (phase 2; docs/adr/0006-aero-gauges-and-governance.md)
#
# Every entity in this section belongs to the chain its events come from: no Aero handler reads
# or writes another chain's rows. Emission amounts are in the chain's Aero reward token
# (`AeroGauge.rewardToken`): AERO (0x3f5b…a4Ee) on Base, the chain's xAERO receipt token
# elsewhere. Both have 18 decimals and xAERO is redeemable 1:1 for AERO on Base, so amounts are
# summable across chains as AERO-equivalent (but not with the legacy VELO / AERO v1 fields).
# USD values use the reward token's stored price on the event's chain at the event's block.
# ============================================================================

# One Aero gauge (CL or V2) on one chain. Created when the gauge factory emits GaugeCreated,
# completed by GaugeManager.GaugeCreated (rewards manager, module, creator) and the LeafVoter's
# GaugeRegistered / GaugeActivated. The gauge's pool gets Pool.gaugeAddress, so staking flows
# through the shared Pool / UserStatsPerPool / NonFungiblePosition staking fields.
#
# Emission counters mirror the LeafVoter's per-gauge state (`gaugeStates(gauge)`):
# totalEmissionsCredited = ceiling, totalEmissionsMinted = claimed, totalEmissionsForfeited =
# surplus. credited - minted - forfeited is what the gauge can still pay out.
type AeroGauge {
  id: ID! # Format: {chainId}-{gaugeAddress} (AeroGaugeId)
  chainId: Int! @index # chain id
  gaugeAddress: String! @index # gauge contract
  pool_id: String! @index # Pool id ({chainId}-{poolAddress}) of the gauge's target; the Pool row exists when the target is an indexed Aero pool
  poolAddress: String! @index # the gauge's target (pool) address
  isCL: Boolean! # true when created by the CL gauge factory (positions are NFPM NFTs), false for V2 gauges (LP tokens)
  isPool: Boolean! # gauge factory's isPool flag (false for a gauge on a non-pool staking token)
  gaugeFactory: String! @index # gauge factory that deployed the gauge
  votingRewardsManager: String @index # VotingRewardsManager (fees and incentives for allocators); set by GaugeManager.GaugeCreated
  creationModule: String # GaugeManager module that requested the gauge
  creator: String # informational creator the module reported
  rewardToken: String! # token the gauge's LPs receive (AERO on Base, xAERO elsewhere)
  createdBlockNumber: BigInt! @config(precision: 76) # block of the factory GaugeCreated
  createdTimestamp: Timestamp! # block time of the factory GaugeCreated
  createdTransactionHash: String! # creation transaction
  isRegistered: Boolean! # LeafVoter.GaugeRegistered seen (the LeafVoter settles and pays it)
  isActivated: Boolean! # LeafVoter.GaugeActivated seen: allocations route to it (before activation they park on the zero gauge and earn nothing)
  activatedTimestamp: Timestamp # block time of activation
  # Per-second emission cap in reward-token wei (EmissionCapSet, refreshed from every GaugeCapSettled).
  # Null until the first EmissionCapSet / GaugeCapSettled: the factory's default cap applies, which is
  # never 0. 0 = deactivated: the gauge earns nothing, allocations to it park idle, its accrual goes to
  # surplus and its fees are not collected. Aero gauges have no other kill / deactivate mechanism.
  emissionCap: BigInt @config(precision: 76)
  emissionCapUpdatedTimestamp: Timestamp # block time of the last cap change
  minStakeBlocks: BigInt @config(precision: 76) # per-gauge minimum stake (blocks) override (MinStakeBlocksSet); null = the factory's AeroGaugeFactory.minStakeBlocks
  referral: String # referral that receives `referralShare` of every LP claim (ReferralConfigSet); null when none
  referralShare: BigInt @config(precision: 24) # referral share in pips (1e6 = 100%); null when none
  lastGaugeWeight: BigInt! @config(precision: 76) # voting power (decayed sAERO weight, 18 decimals) on the gauge at its last LeafVoter settlement (GaugeCapSettled.gaugeWeight)
  lastSettlementTimestamp: Timestamp # block time of the last GaugeCapSettled
  totalAllocated: BigInt! @config(precision: 76) # sum of sAERO allocations booked on this gauge by this chain's LeafVoter, in AERO (undecayed nominal amounts; phase 3, see AeroLeafAllocation)
  totalEmissionsCredited: BigInt! @config(precision: 76) # sum of GaugeCapSettled.effectiveShare: emissions the LeafVoter credited to the gauge (= gaugeStates.ceiling)
  totalCapSurplus: BigInt! @config(precision: 76) # sum of GaugeCapSettled.surplusDelta: accrual above the cap, sent to the chain surplus instead of the gauge
  totalEmissionsForfeited: BigInt! @config(precision: 76) # sum of LeafVoter.EmissionsForfeited: credited emissions the gauge returned (accrued while no staked liquidity was in range, early-withdraw penalties) (= gaugeStates.surplus)
  totalEmissionsMinted: BigInt! @config(precision: 76) # sum of LeafVoter.EmissionsMinted: emissions minted on claim (= gaugeStates.claimed); equals LP claims + deferred claims + referral claims
  totalEmissionsMintedUSD: BigInt! @config(precision: 76) # USD (1e18) of totalEmissionsMinted at each mint's block
  totalEmissionsClaimed: BigInt! @config(precision: 76) # LP claims paid at once (EmissionsClaimed)
  totalDeferredEmissionsClaimed: BigInt! @config(precision: 76) # earlier deferred LP emissions paid out (DeferredEmissionsClaimed)
  totalEmissionsDeferred: BigInt! @config(precision: 76) # LP emissions stored because the mint failed during a withdrawal (EmissionsDeferred)
  totalReferralEmissionsDeferred: BigInt! @config(precision: 76) # referral cut stored for the referral (ReferralEmissionsDeferred)
  totalReferralEmissionsClaimed: BigInt! @config(precision: 76) # referral emissions paid out (ReferralEmissionsClaimed)
  totalEarlyWithdrawPenalty: BigInt! @config(precision: 76) # emissions forfeited by LPs who claimed or withdrew inside the minimum stake window (EarlyWithdrawPenalty); part of totalEmissionsForfeited
  numberOfClaims: BigInt! @config(precision: 76) # EmissionsClaimed events
  numberOfDeposits: BigInt! @config(precision: 76) # Deposit events
  numberOfWithdrawals: BigInt! @config(precision: 76) # Withdraw and EmergencyWithdraw events
  totalFeesClaimed0: BigInt! @config(precision: 76) # staked-liquidity pool fees (token0, raw units) the gauge sent to its VotingRewardsManager (gauge ClaimFees)
  totalFeesClaimed1: BigInt! @config(precision: 76) # as totalFeesClaimed0, token1
  totalFeesClaimedUSD: BigInt! @config(precision: 76) # USD (1e18) of totalFeesClaimed0/1 at each claim's block (trusted prices only)
  lastUpdatedTimestamp: Timestamp! # block time of the last change
  lastSnapshotTimestamp: Timestamp # epoch of the last AeroGaugeSnapshot; null = never snapshotted
}

# Hourly snapshot of AeroGauge (written at the first change in each hour, after the change), for
# emissions, weight and cap time series. ClickHouse only.
type AeroGaugeSnapshot @storage(postgres: false, clickhouse: true) {
  id: ID! # Format: {chainId}-{gaugeAddress}-{epochMs}
