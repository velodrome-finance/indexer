  poolAddress: String! @index # the gauge's pool
  isCL: Boolean! # CL or V2 gauge
  timestamp: Timestamp! @index # snapshot epoch (hour)
  isActivated: Boolean! # see AeroGauge
  emissionCap: BigInt @config(precision: 76) # see AeroGauge
  lastGaugeWeight: BigInt! @config(precision: 76) # see AeroGauge
  totalAllocated: BigInt! @config(precision: 76) # see AeroGauge
  totalEmissionsCredited: BigInt! @config(precision: 76) # see AeroGauge
  totalCapSurplus: BigInt! @config(precision: 76) # see AeroGauge
  totalEmissionsForfeited: BigInt! @config(precision: 76) # see AeroGauge
  totalEmissionsMinted: BigInt! @config(precision: 76) # see AeroGauge
  totalEmissionsMintedUSD: BigInt! @config(precision: 76) # see AeroGauge
  totalEarlyWithdrawPenalty: BigInt! @config(precision: 76) # see AeroGauge
  totalFeesClaimed0: BigInt! @config(precision: 76) # see AeroGauge
  totalFeesClaimed1: BigInt! @config(precision: 76) # see AeroGauge
  totalFeesClaimedUSD: BigInt! @config(precision: 76) # see AeroGauge
}

# A gauge's referral configured inside its factory's createGauge, whose ReferralConfigSet is
# emitted before the factory's GaugeCreated. The GaugeCreated reads it by primary key and deletes it.
type AeroGaugePendingReferral
  @storage(postgres: true, clickhouse: false)
  @internal
{
  id: ID! # Same as the gauge's id: {chainId}-{gaugeAddress} (AeroGaugeId)
  referral: String! # referral address
  referralShare: BigInt! @config(precision: 24) # referral share, pips
}

# Configuration of one Aero gauge factory (CL or V2) on one chain, from its own events. The
# default cap is not emitted at deployment, so defaultCap is null until a DefaultCapSet.
type AeroGaugeFactory {
  id: ID! # Format: {chainId}-{factoryAddress}
  chainId: Int! @index # chain id
  factoryAddress: String! # gauge factory
  isCL: Boolean! # CL gauge factory (true) or V2 gauge factory (false)
  defaultCap: BigInt @config(precision: 76) # per-second cap new gauges start with (DefaultCapSet); null = never emitted (set at deployment)
  operatorMinCap: BigInt @config(precision: 76) # lowest cap the cap operator may set (OperatorCapRangeSet)
  operatorMaxCap: BigInt @config(precision: 76) # highest cap the cap operator may set (OperatorCapRangeSet)
  minStakeBlocks: BigInt @config(precision: 76) # default minimum stake in blocks before a claim or withdrawal is penalty-free (PenaltyConfigSet)
  penaltyRate: BigInt @config(precision: 24) # early-withdraw penalty in pips (1e6 = 100%) of the accrued emissions (PenaltyConfigSet); 0 = no penalty
  maxShareCap: BigInt @config(precision: 24) # ceiling on per-gauge referral shares, pips (MaxShareCapSet)
  emergencyWithdrawEnabled: Boolean! # EmergencyWithdrawEnabledSet; while true LPs can exit without touching the LeafVoter (losing unsettled emissions)
  numberOfGauges: Int! # gauges this factory created
  lastUpdatedTimestamp: Timestamp! # block time of the last change
}

# The Aero LeafVoter of one chain (same address on every chain, Base included): its
# configuration and chain-level emission totals. Phase 3 adds the allocation fields.
type AeroLeafVoterState {
  id: ID! # Format: {chainId}
  chainId: Int! # chain id
  leafVoter: String! # LeafVoter address
  rewardToken: String! # token claims pay (AERO on Base, xAERO elsewhere)
  chainStatus: Int # LeafVoter ChainStatusSet: 1 Active, 2 Paused, 3 Suspended, 4 Sunset; null = never set (Active since construction)
  totalEmissionsCredited: BigInt! @config(precision: 76) # sum of GaugeCapSettled.effectiveShare over real gauges
  totalCapSurplus: BigInt! @config(precision: 76) # sum of GaugeCapSettled.surplusDelta, the zero gauge (idle allocations) included
  totalIdleSurplus: BigInt! @config(precision: 76) # the part of totalCapSurplus settled on the zero gauge: emissions of allocations parked idle or on unroutable gauges
  totalEmissionsForfeited: BigInt! @config(precision: 76) # sum of EmissionsForfeited (gauges)
  totalEmissionsMinted: BigInt! @config(precision: 76) # sum of EmissionsMinted: receipt tokens minted on claims (on Base redeemed to AERO in the same transaction)
  totalEmissionsMintedUSD: BigInt! @config(precision: 76) # USD (1e18) of totalEmissionsMinted at each mint
  totalRedeemed: BigInt! @config(precision: 76) # sum of Redeemed: receipt tokens burned to redeem AERO on Base
  numberOfRedemptions: BigInt! @config(precision: 76) # Redeemed events
  receiptTokenSupply: BigInt! @config(precision: 76) # totalEmissionsMinted - totalRedeemed: xAERO outstanding (on Base: xAERO whose redemption the RootEmissionsHandler deferred)
  emissionsPerVP: BigInt @config(precision: 76) # emissions per unit of voting power, 1e18-scaled, as of the last ChainAllocated / GaugesAllocated (0 while Suspended or Sunset)
  totalChainAllocation: BigInt! @config(precision: 76) # sum of AeroLeafTokenState.chainAllocation: sAERO budget sent to this chain
  totalBookedAllocation: BigInt! @config(precision: 76) # sum of booked gauge allocations (= sum of AeroGauge.totalAllocated); the rest of totalChainAllocation is idle
  allocationCooldown: BigInt @config(precision: 76) # AllocationCooldownSet (seconds); null = deployment value (169,200 s, 47 hours, in the constructor)
  maxGauges: BigInt @config(precision: 76) # MaxGaugesSet; null = deployment value (20)
  minIncentiveDuration: BigInt @config(precision: 76) # MinIncentiveDurationSet (seconds); null = deployment value (172,800 s)
  localVotingEnabled: Boolean # LocalVotingEnabledSet; null = deployment value (false)
  lastUpdatedTimestamp: Timestamp! # block time of the last change
  lastSnapshotTimestamp: Timestamp # epoch of the last AeroLeafVoterStateSnapshot
}

# Hourly snapshot of AeroLeafVoterState (chain-level emission totals). ClickHouse only.
type AeroLeafVoterStateSnapshot @storage(postgres: false, clickhouse: true) {
  id: ID! # Format: {chainId}-{epochMs}
  chainId: Int! @index # chain id
  timestamp: Timestamp! @index # snapshot epoch (hour)
  totalEmissionsCredited: BigInt! @config(precision: 76) # see AeroLeafVoterState
  totalCapSurplus: BigInt! @config(precision: 76) # see AeroLeafVoterState
  totalIdleSurplus: BigInt! @config(precision: 76) # see AeroLeafVoterState
  totalEmissionsForfeited: BigInt! @config(precision: 76) # see AeroLeafVoterState
  totalEmissionsMinted: BigInt! @config(precision: 76) # see AeroLeafVoterState
  totalEmissionsMintedUSD: BigInt! @config(precision: 76) # see AeroLeafVoterState
  totalRedeemed: BigInt! @config(precision: 76) # see AeroLeafVoterState
  receiptTokenSupply: BigInt! @config(precision: 76) # see AeroLeafVoterState
  emissionsPerVP: BigInt @config(precision: 76) # see AeroLeafVoterState
  totalChainAllocation: BigInt! @config(precision: 76) # see AeroLeafVoterState
  totalBookedAllocation: BigInt! @config(precision: 76) # see AeroLeafVoterState
}

# The VotingRewardsManager of one Aero gauge: the pool fees its gauge collects from staked
# liquidity, the incentive programs funded for allocators, and what sAERO allocators claim.
type AeroVotingRewardsManager {
  id: ID! # Format: {chainId}-{votingRewardsManagerAddress}
  chainId: Int! @index # chain id
  address: String! @index # VotingRewardsManager
  gaugeAddress: String! @index # its gauge
  poolAddress: String! @index # the gauge's pool
  totalFeesCollectedUSD: BigInt! @config(precision: 76) # USD (1e18) of FeesCollected (pool fees pulled from the gauge), trusted prices at each block
  numberOfFeeCollections: BigInt! @config(precision: 76) # FeesCollected events (one per token)
  totalFeesClaimedUSD: BigInt! @config(precision: 76) # USD (1e18) of fees allocators claimed (ClaimFees, per token), trusted prices at each block
  numberOfFeeClaims: BigInt! @config(precision: 76) # ClaimFees events
  totalIncentivesFundedUSD: BigInt! @config(precision: 76) # USD (1e18) of incentive programs funded (IncentiveCreated), trusted prices at creation
  numberOfIncentivePrograms: BigInt! @config(precision: 76) # IncentiveCreated events
  totalIncentivesClaimedUSD: BigInt! @config(precision: 76) # USD (1e18) of incentives allocators claimed (ClaimIncentives), trusted prices at each block
  numberOfIncentiveClaims: BigInt! @config(precision: 76) # ClaimIncentives events
  lastUpdatedTimestamp: Timestamp! # block time of the last change
}

# One row per Aero gauge Deposit, Withdraw or EmergencyWithdraw. ClickHouse only.
type AeroGaugeStakeEvent @storage(postgres: false, clickhouse: true) {
  id: ID! # Format: {chainId}-{txHash}-{logIndex}
  chainId: Int! # chain id
  kind: String! # DEPOSIT | WITHDRAW | EMERGENCY_WITHDRAW (values pinned by AERO_STAKE_EVENT_KIND)
  gaugeAddress: String! @index # gauge
  poolAddress: String! @index # the gauge's pool
  isCL: Boolean! # CL (amount = liquidity L, tokenId set) or V2 (amount = LP tokens)
  account: String! @index # staked owner (CL _user / V2 _account)
  caller: String # transaction-level caller (Deposit / Withdraw _caller); null on EmergencyWithdraw
  tokenId: BigInt @config(precision: 76) # CL position NFT; null on V2 gauges
  amount: BigInt! @config(precision: 76) # liquidity (CL) or LP tokens (V2) staked or unstaked
  blockNumber: BigInt! @config(precision: 76) # block number
  timestamp: Timestamp! @index # block time
  transactionHash: String! # transaction
}

# One row per Aero gauge emissions event per LP: claims, deferrals, referral legs, early-withdraw
# penalties. Mints, forfeits and settlements are per gauge on AeroGauge / AeroGaugeSnapshot.
# ClickHouse only.
type AeroEmissionsEvent @storage(postgres: false, clickhouse: true) {
  id: ID! # Format: {chainId}-{txHash}-{logIndex}
  chainId: Int! # chain id
  # CLAIMED (EmissionsClaimed: paid to recipient), DEFERRED (EmissionsDeferred: stored after a failed
  # mint), DEFERRED_CLAIMED (DeferredEmissionsClaimed), REFERRAL_DEFERRED (ReferralEmissionsDeferred:
  # the referral's cut of an LP claim), REFERRAL_CLAIMED (ReferralEmissionsClaimed),
  # EARLY_WITHDRAW_PENALTY (EarlyWithdrawPenalty: forfeited by the LP). Pinned by AERO_EMISSIONS_EVENT_KIND.
  kind: String!
  gaugeAddress: String! @index # gauge
  poolAddress: String! @index # the gauge's pool
  account: String! @index # LP staker (REFERRAL_DEFERRED: the LP whose claim paid the referral; REFERRAL_CLAIMED: the referral)
  recipient: String # recipient of a paid amount (CLAIMED, DEFERRED_CLAIMED, REFERRAL_CLAIMED)
  referral: String # referral address (REFERRAL_DEFERRED)
  tokenId: BigInt @config(precision: 76) # CL position NFT (per-position CL events); null otherwise
  amount: BigInt! @config(precision: 76) # reward-token amount (18 decimals)
  amountUSD: BigInt! @config(precision: 76) # USD (1e18) at the reward token's stored price
  rewardToken: String! # AERO (Base) or xAERO
  blockNumber: BigInt! @config(precision: 76) # block number
  timestamp: Timestamp! @index # block time
  transactionHash: String! # transaction
}

# One row per redemption step. Phase 2: INITIATED (LeafVoter.Redeemed: xAERO burned on a leaf chain
# for AERO on Base). On Base the RootEmissionsHandler redeems every claim automatically; those
# internal redemptions are counted on AeroLeafVoterState but get no row. Phase 3 adds the root side.
# ClickHouse only.
type AeroRedemptionEvent @storage(postgres: false, clickhouse: true) {
  id: ID! # Format: {chainId}-{txHash}-{logIndex}
  chainId: Int! # chain the event was emitted on
  kind: String! # INITIATED | PROCESSED | DEFERRED | BUFFER_DRAWN | DONATED | SURPLUS_SPENT (pinned by AERO_REDEMPTION_EVENT_KIND)
  sourceChainId: Int! # chain whose receipt tokens are redeemed (INITIATED: the emitting chain; root kinds: the event's chain id)
  redeemer: String # address whose xAERO was burned (INITIATED)
  recipient: String @index # AERO recipient on Base
  amount: BigInt! @config(precision: 76) # 18-decimal amount (xAERO burned / AERO minted or paid)
  surplusReported: BigInt @config(precision: 76) # PROCESSED: the chain's reported surplus high-water mark after the redeem
  blockNumber: BigInt! @config(precision: 76) # block number
  timestamp: Timestamp! @index # block time
  transactionHash: String! # transaction
}

# One row per VotingRewardsManager flow. Phase 2: FEES_COLLECTED (pool fees of staked liquidity
# pulled from the gauge into the manager, per token). Phase 3 adds the allocator side. ClickHouse only.
type AeroVotingRewardsEvent @storage(postgres: false, clickhouse: true) {
  id: ID! # Format: {chainId}-{txHash}-{logIndex}
  chainId: Int! # chain id
  kind: String! # FEES_COLLECTED | FEES_CLAIMED | INCENTIVE_CREATED | INCENTIVE_CLAIMED | INCENTIVE_SWEPT (pinned by AERO_VOTING_REWARDS_EVENT_KIND)
  votingRewardsManager: String! @index # VotingRewardsManager
  gaugeAddress: String! @index # its gauge
  poolAddress: String! @index # the gauge's pool
  tokenId: BigInt @config(precision: 76) # sAERO position (claims)
  recipient: String @index # claim recipient (claims)
  token: String # token moved; null on INCENTIVE_CLAIMED / INCENTIVE_SWEPT rows whose program is unknown
  programId: BigInt @config(precision: 76) # incentive program (INCENTIVE_*)
  amount: BigInt! @config(precision: 76) # raw token amount
  amountUSD: BigInt! @config(precision: 76) # USD (1e18) at the token's stored price on this chain; 0 when the token is untrusted or not indexed
  blockNumber: BigInt! @config(precision: 76) # block number
  timestamp: Timestamp! @index # block time
  transactionHash: String! # transaction
}

# ============================================================================
# Aero (MetaDEX) governance: sAERO, allocations, allocator rewards, Minter, redemptions and
# migration (phase 3; docs/adr/0006-aero-gauges-and-governance.md)
#
# sAERO lives in the VotingEscrow on Base. Allocations exist twice, as each chain's own truth:
# the root Voter on Base books a position's voting power per chain (AeroRootAllocation) and
# dispatches gauge splits (AeroRootGaugeVote); each chain's LeafVoter books the split it applied
# (AeroLeafTokenState / AeroLeafAllocation). Nothing reconciles the two inside the indexer: a
# dispatch can be in flight, expire or be rejected by the leaf. Join them in queries.
#
# Voting power of an sAERO amount A at time t: A for a permanent stake, else
# A * max(0, stakeEnd - t) / 126_144_000 (MAXTIME, 4 x 365 days), as the contracts compute it.
# Allocation amounts are always the undecayed AERO amount A.
# ============================================================================

# One sAERO position (VotingEscrow NFT) on Base. tokenId 0 is the protocol accumulator (fees the
# VoterPaymentsModule charges, permanently staked, burned through Burn); it has no NFT and no owner.
type SAeroPosition {
  id: ID! # Format: {chainId}-{tokenId} (SAeroPositionId)
  chainId: Int! # chain id (Base)
  tokenId: BigInt! @config(precision: 76) @index # VotingEscrow tokenId
  owner: String! @index # current NFT owner (zero address for the accumulator)
  amount: BigInt! @config(precision: 76) # AERO staked (18 decimals)
  stakeEnd: BigInt! @config(precision: 76) # unlock time (unix seconds, week-aligned); 0 for a permanent stake or an empty position
  isPermanent: Boolean! # permanent stake: no decay, voting power = amount
  createdVia: String! # MINT_PENDING (NFT minted, stake not seen yet), CREATE_STAKE (createStake), REBALANCE (minted by a VoterPaymentsModule split / merge), ACCUMULATOR (tokenId 0)
  totalDeposited: BigInt! @config(precision: 76) # AERO deposited by createStake / reviveStake / increaseStakeAmount
  totalWithdrawn: BigInt! @config(precision: 76) # AERO withdrawn after expiry (Withdraw)
  totalRebalancedIn: BigInt! @config(precision: 76) # AERO moved in by VotingEscrow.Rebalance (VoterPaymentsModule deposits, splits, merges)
  totalRebalancedOut: BigInt! @config(precision: 76) # AERO moved out by VotingEscrow.Rebalance
  createdTimestamp: Timestamp! # block time of the mint (or first touch for the accumulator)
  createdTransactionHash: String! # mint transaction
  lastUpdatedTimestamp: Timestamp! # block time of the last change
}

# One row per change to an sAERO position. ClickHouse only.
type SAeroPositionEvent @storage(postgres: false, clickhouse: true) {
  id: ID! # Format: {chainId}-{txHash}-{logIndex}[-{leg}] (a Rebalance writes one row per leg)
  chainId: Int! # chain id (Base)
  # MINT (NFT minted), TRANSFER (owner change), CREATE_STAKE / INCREASE_AMOUNT / INCREASE_PERIOD /
  # REVIVE_STAKE (Deposit by type), WITHDRAW, UPGRADE_PERMANENT, DOWNGRADE_PERMANENT, REBALANCE_OUT /
  # REBALANCE_IN (one row per VotingEscrow.Rebalance leg), BURN (accumulator).
  # Pinned by SAERO_EVENT_KIND.
  kind: String!
  tokenId: BigInt! @config(precision: 76) @index # position
  owner: String @index # owner after the change
  counterparty: String # TRANSFER: previous owner; Deposit: provider
  amount: BigInt! @config(precision: 76) # AERO moved by this change (0 for owner, period and mode changes)
  amountAfter: BigInt! @config(precision: 76) # position amount after the change
  stakeEndAfter: BigInt! @config(precision: 76) # unlock time after the change (0 = permanent or empty)
  isPermanentAfter: Boolean! # permanent after the change
  supplyAfter: BigInt @config(precision: 76) # VotingEscrow supply after the change (the transaction's Supply event; null when the change emits none)
  blockNumber: BigInt! @config(precision: 76) # block number
  timestamp: Timestamp! @index # block time
  transactionHash: String! # transaction
}

# The VotingEscrow (sAERO) on Base: supply and position counts.
type SAeroEscrowState {
  id: ID! # Format: {chainId}
  chainId: Int! # chain id (Base)
  supply: BigInt! @config(precision: 76) # total AERO staked (Supply event; = sum of SAeroPosition.amount)
  permanentStakeBalance: BigInt! @config(precision: 76) # AERO in permanent positions (accumulator included), tracked from position changes
  accumulatorAmount: BigInt! @config(precision: 76) # AERO held by the tokenId-0 protocol accumulator
  totalBurned: BigInt! @config(precision: 76) # accumulator AERO burned (Burn)
  numberOfPositions: Int! # sAERO NFTs minted
  lastTokenId: BigInt! @config(precision: 76) # highest tokenId minted
  lastUpdatedTimestamp: Timestamp! # block time of the last change
  lastSnapshotTimestamp: Timestamp # epoch of the last SAeroEscrowStateSnapshot
}

# Hourly snapshot of SAeroEscrowState. ClickHouse only.
type SAeroEscrowStateSnapshot @storage(postgres: false, clickhouse: true) {
  id: ID! # Format: {chainId}-{epochMs}
  chainId: Int! # chain id
  timestamp: Timestamp! @index # snapshot epoch (hour)
  supply: BigInt! @config(precision: 76) # see SAeroEscrowState
  permanentStakeBalance: BigInt! @config(precision: 76) # see SAeroEscrowState
  accumulatorAmount: BigInt! @config(precision: 76) # see SAeroEscrowState
  numberOfPositions: Int! # see SAeroEscrowState
}

# Root Voter (Base): voting power a position has booked on one chain. targetChainId 0 is CHAIN0,
# the idle pool new stake parks on and every allocation draws from; ChainsAllocated moves power from
# CHAIN0 to a chain, a confirmed leaf deallocation moves it back. Mirrors Voter.allocationChainAmounts.
type AeroRootAllocation {
  id: ID! # Format: {chainId}-{tokenId}-{targetChainId}
  chainId: Int! # chain of the root Voter (Base)
  tokenId: BigInt! @config(precision: 76) @index # sAERO position
  targetChainId: Int! @index # chain the power is booked on; 0 = CHAIN0 (idle, earns nothing)
  amount: BigInt! @config(precision: 76) # AERO booked (undecayed)
  lastUpdatedTimestamp: Timestamp! # block time of the last change
}

# Root Voter (Base): the gauge split a position last dispatched to one chain (GaugesAllocated on the
# root Voter). Requested, not applied: the leaf may reject or redirect parts of it.
type AeroRootGaugeVote {
  id: ID! # Format: {chainId}-{tokenId}-{targetChainId}
  chainId: Int! # chain of the root Voter (Base)
  tokenId: BigInt! @config(precision: 76) @index # sAERO position
  targetChainId: Int! @index # chain the split was dispatched to
  gauges: [String!]! # gauge addresses (the zero address = park idle; the dealloc sentinel = return to CHAIN0)
  amounts: [BigInt!]! # AERO per gauge, parallel to gauges
  lastDispatchedTimestamp: Timestamp! # block time of the dispatch
  transactionHash: String! # dispatch transaction
}

# Root Voter (Base): per-chain ledger. targetChainId 0 is CHAIN0 (idle power; also counts the
# accumulator power burned through Burned).
type AeroRootChainState {
  id: ID! # Format: {chainId}-{targetChainId}
  chainId: Int! # chain of the root Voter (Base)
  targetChainId: Int! @index # chain (0 = CHAIN0)
  isRegistered: Boolean! # ChainRegistered seen (chains registered at deployment emit nothing and are marked on first use)
  status: Int # ChainStatusSet: 1 Active, 2 Paused, 3 Suspended, 4 Sunset; null = never set
  emergencyDeallocationAllowed: Boolean! # EmergencyDeallocationAllowedSet
  totalAllocated: BigInt! @config(precision: 76) # AERO booked on the chain over all positions (sum of AeroRootAllocation.amount)
  totalRedeemed: BigInt! @config(precision: 76) # AERO paid out for the chain's redemptions (RedeemProcessed)
  numberOfRedemptions: BigInt! @config(precision: 76) # RedeemProcessed events
  reportedSurplus: BigInt! @config(precision: 76) # surplus high-water mark the chain reported (latest RedeemProcessed)
  totalDonated: BigInt! @config(precision: 76) # AERO donated into the chain's redeem buffer (Donated)
  totalBufferDrawn: BigInt! @config(precision: 76) # buffer AERO paid out past the chain's ceiling (BufferDrawn)
  totalSurplusSpent: BigInt! @config(precision: 76) # surplus governance minted (SurplusSpent)
  totalBurned: BigInt! @config(precision: 76) # CHAIN0 only: accumulator power burned (Burned)
  lastUpdatedTimestamp: Timestamp! # block time of the last change
}

# LeafVoter (every chain): a position's state on this chain. chainAllocation is the budget the root
# Voter sent; gauges / allocations are the split this LeafVoter booked (only registered, activated
# gauges with a non-zero cap, unless the position may vote for zero-cap gauges); the rest of the
# budget is parked idle on the zero gauge and earns nothing.
type AeroLeafTokenState {
  id: ID! # Format: {chainId}-{tokenId}
  chainId: Int! @index # chain id
  tokenId: BigInt! @config(precision: 76) @index # sAERO position (lives on Base)
  chainAllocation: BigInt! @config(precision: 76) # budget on this chain (ChainAllocated; less dealloc returns)
  gauges: [String!]! # gauges the budget is booked on
  allocations: [BigInt!]! # AERO booked per gauge, parallel to gauges
  idleAllocation: BigInt! @config(precision: 76) # chainAllocation minus the booked total: parked on the zero gauge
  operator: String # address allowed to re-split locally and claim rewards here (OperatorSet)
  canVoteForZeroCapGauges: Boolean! # CanVoteForZeroCapGaugesSet: may book weight on activated gauges with a 0 cap
  lastAllocatedTimestamp: Timestamp # block time of the last applied gauge split (the 47-hour cooldown counts from here)
  lastUpdatedTimestamp: Timestamp! # block time of the last change
}

# LeafVoter (every chain): a position's booked allocation on one gauge. 0 once removed (the row is
# kept). Sum over tokenIds = AeroGauge.totalAllocated.
type AeroLeafAllocation {
  id: ID! # Format: {chainId}-{tokenId}-{gaugeAddress}
  chainId: Int! @index # chain id
  tokenId: BigInt! @config(precision: 76) @index # sAERO position
  gaugeAddress: String! @index # gauge
  poolAddress: String # the gauge's pool (null if the gauge is not indexed)
  allocated: BigInt! @config(precision: 76) # AERO booked (undecayed); 0 = no longer allocated
  lastUpdatedTimestamp: Timestamp! # block time of the last change
}

# One row per allocation change: root ledger moves (PARKED, CHAIN_ALLOCATED, DEALLOCATION_PROCESSED,
# EMERGENCY_DEALLOCATED, TOKEN_CLEARED, CHAIN0_REBALANCED, BURNED, GAUGES_DISPATCHED: one row per
# dispatched gauge) and leaf changes (CHAIN_ALLOCATED, GAUGE_ALLOCATED: one row per listed or
# removed gauge, DEALLOCATED, EMERGENCY_DEALLOCATION_APPLIED). Pinned by AERO_ALLOCATION_EVENT_KIND.
# ClickHouse only.
type AeroAllocationEvent @storage(postgres: false, clickhouse: true) {
  id: ID! # Format: {chainId}-{txHash}-{logIndex}[-{leg}]
  chainId: Int! # chain the event was emitted on
  level: String! # ROOT (root Voter, Base) | LEAF (LeafVoter)
  kind: String! # see above
  tokenId: BigInt! @config(precision: 76) @index # sAERO position (0 for TOKEN0 burns)
  targetChainId: Int # ROOT: the chain the power moved to or from (0 = CHAIN0); LEAF: the emitting chain
  gaugeAddress: String @index # gauge (GAUGES_DISPATCHED, GAUGE_ALLOCATED)
  amount: BigInt! @config(precision: 76) # AERO moved or requested (signed for ledger moves: negative = removed)
  bookedAmount: BigInt @config(precision: 76) # GAUGE_ALLOCATED: AERO this LeafVoter booked on the gauge after the change
  chainAllocationAfter: BigInt @config(precision: 76) # LEAF: the position's budget on the chain after the change
  emissionsPerVP: BigInt @config(precision: 76) # LEAF CHAIN_ALLOCATED / GAUGE_ALLOCATED: the LeafVoter's emissions-per-voting-power scalar (1e18-scaled)
  blockNumber: BigInt! @config(precision: 76) # block number
  timestamp: Timestamp! @index # block time
  transactionHash: String! # transaction
}

# An incentive program funded on a gauge's VotingRewardsManager, streamed to its allocators.
type AeroIncentiveProgram {
  id: ID! # Format: {chainId}-{votingRewardsManager}-{programId}
  chainId: Int! @index # chain id
  votingRewardsManager: String! @index # rewards manager
  gaugeAddress: String! @index # its gauge
  poolAddress: String! # the gauge's pool
  programId: BigInt! @config(precision: 76) # program id within the manager
  token: String! @index # incentive token
  creator: String! @index # funder
  amount: BigInt! @config(precision: 76) # raw amount funded
  amountUSD: BigInt! @config(precision: 76) # USD (1e18) at creation (trusted prices only)
  start: Timestamp! # stream start
  end: Timestamp! # stream end (start + duration)
  totalClaimed: BigInt! @config(precision: 76) # raw amount claimed by allocators (ClaimIncentives)
  totalSwept: BigInt! @config(precision: 76) # raw unclaimable remainder returned to the creator (IncentiveSwept)
  createdTimestamp: Timestamp! # block time of IncentiveCreated
  transactionHash: String! # funding transaction
}

# The Minter on Base. It mints AERO only when a redemption is processed (and the team share to the
# Splitter with it), so totalMinted grows with claims, not with time. Rates are null until their
# setter emits (the deployment values are constructor arguments).
type AeroMinterState {
  id: ID! # Format: {chainId}-{minterAddress}
  chainId: Int! # chain id (Base)
  minter: String! # Minter address
  baseRate: BigInt @config(precision: 76) # BaseRateSet: base emission rate (AERO wei per second)
  dynamicRate: BigInt @config(precision: 76) # DynamicRateSet: dynamic rate target (raw, clamped to the band on read)
  teamRate: BigInt @config(precision: 24) # TeamRateSet: team share in pips
  bandFloorPips: BigInt @config(precision: 24) # RateBandSet: maximum downward move from the base rate
  bandCeilingPips: BigInt @config(precision: 24) # RateBandSet: maximum upward move from the base rate
  maxBaseRateChangePips: BigInt @config(precision: 24) # MaxBaseRateChangePipsSet
  baseRateUpdateCooldown: BigInt @config(precision: 76) # BaseRateUpdateCooldownSet (seconds)
  operator: String # OperatorSet
  fed: String # FEDSet
  dynamicRateModule: String # DynamicRateModuleSet
  totalMinted: BigInt! @config(precision: 76) # AERO minted to redemption recipients (Minted.amount)
  totalSplitterShare: BigInt! @config(precision: 76) # AERO minted to the Splitter (Minted.splitterShare)
  numberOfMints: BigInt! @config(precision: 76) # Minted events
  lastUpdatedTimestamp: Timestamp! # block time of the last change
  lastSnapshotTimestamp: Timestamp # epoch of the last AeroMinterSnapshot
}

# Hourly snapshot of AeroMinterState (mint totals and rates). ClickHouse only.
type AeroMinterSnapshot @storage(postgres: false, clickhouse: true) {
  id: ID! # Format: {chainId}-{minterAddress}-{epochMs}
  chainId: Int! # chain id
  timestamp: Timestamp! @index # snapshot epoch (hour)
  baseRate: BigInt @config(precision: 76) # see AeroMinterState
  dynamicRate: BigInt @config(precision: 76) # see AeroMinterState
  teamRate: BigInt @config(precision: 24) # see AeroMinterState
  totalMinted: BigInt! @config(precision: 76) # see AeroMinterState
  totalSplitterShare: BigInt! @config(precision: 76) # see AeroMinterState
  numberOfMints: BigInt! @config(precision: 76) # see AeroMinterState
}

# One row per Minter configuration change (rates, band, operator, FED, module). ClickHouse only.
type AeroMinterEvent @storage(postgres: false, clickhouse: true) {
  id: ID! # Format: {chainId}-{txHash}-{logIndex}
  chainId: Int! # chain id
  kind: String! # BASE_RATE_SET | DYNAMIC_RATE_SET | TEAM_RATE_SET | RATE_BAND_SET | MAX_BASE_RATE_CHANGE_PIPS_SET | BASE_RATE_UPDATE_COOLDOWN_SET | OPERATOR_SET | FED_SET | DYNAMIC_RATE_MODULE_SET
  value: BigInt @config(precision: 76) # new numeric value (RATE_BAND_SET: the floor)
  value2: BigInt @config(precision: 76) # RATE_BAND_SET: the ceiling
  address: String # new address (OPERATOR_SET, FED_SET, DYNAMIC_RATE_MODULE_SET)
  blockNumber: BigInt! @config(precision: 76) # block number
  timestamp: Timestamp! @index # block time
  transactionHash: String! # transaction
}

# One row per legacy-to-Aero migration: veAERO / AERO v1 on Base (AerodromeMigration), veVELO /
# VELO on Optimism (VelodromeMigration) and their settlement on Base (VelodromeMigrationEntrypoint).
# ClickHouse only.
type AeroMigrationEvent @storage(postgres: false, clickhouse: true) {
  id: ID! # Format: {chainId}-{txHash}-{logIndex}
  chainId: Int! # chain id
  migrationContract: String! # migration contract
  kind: String! # VENFT (veNFT migrated), LIQUID (liquid tokens migrated), SETTLED (Optimism migration settled on Base)
  legacyToken: String! # AERO_V1 (Base) or VELO (Optimism)
  depositor: String # VENFT / LIQUID: legacy holder
  recipient: String! @index # receiver of the new AERO or sAERO
  legacyTokenId: BigInt @config(precision: 76) # VENFT: legacy veNFT id
  amountIn: BigInt @config(precision: 76) # VENFT / LIQUID: legacy amount (18 decimals)
  amountOut: BigInt! @config(precision: 76) # new AERO (VENFT / LIQUID: converted amount; SETTLED: amount settled on Base)
  isPermanent: Boolean # VENFT: the legacy lock was permanent
  isLiquid: Boolean # VENFT: settled as liquid AERO (expired lock); SETTLED: liquid settlement
  nonce: BigInt @config(precision: 76) # SETTLED: Hyperlane migration nonce
  blockNumber: BigInt! @config(precision: 76) # block number
  timestamp: Timestamp! @index # block time
  transactionHash: String! # transaction
}

# Totals of one migration contract.
type AeroMigrationTotals {
  id: ID! # Format: {chainId}-{migrationContract}
  chainId: Int! # chain id
  migrationContract: String! # migration contract
  legacyToken: String! # AERO_V1 or VELO (SETTLED totals: VELO)
  numberOfVeNFTs: BigInt! @config(precision: 76) # veNFTs migrated (VeNFTMigrated)
  veNFTAmountIn: BigInt! @config(precision: 76) # legacy locked amount migrated
  veNFTAmountOut: BigInt! @config(precision: 76) # new AERO (as sAERO or liquid) for those veNFTs
  numberOfLiquid: BigInt! @config(precision: 76) # liquid migrations (LiquidMigrated)
  liquidAmountIn: BigInt! @config(precision: 76) # legacy liquid tokens migrated
  liquidAmountOut: BigInt! @config(precision: 76) # new AERO for them
  numberOfSettlements: BigInt! @config(precision: 76) # SETTLED (Base entrypoint Migrated)
  settledAmount: BigInt! @config(precision: 76) # AERO settled on Base for Optimism migrations
  lastUpdatedTimestamp: Timestamp! # block time of the last change
}
